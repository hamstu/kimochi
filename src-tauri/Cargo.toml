[package]
name = "kimochi"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
libc = "0.2"
meikiocr = { path = "../../kimochi-meikiocr" }
mangaocr = { path = "../../kimochi-mangaocr" }
image = { version = "0.25", default-features = false, features = ["png"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
# `macos-private-api` stays in this common block: tauri-build requires the common
# declaration's features to match tauri.conf.json (`macOSPrivateApi: true`), so it
# cannot move to a macOS-only block. Off macOS the feature compiles to nothing.
tauri = { version = "=2.11.5", features = [
  "devtools",
  "macos-private-api",
  "tray-icon",
  "image-png",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2.6"
tauri-plugin-global-shortcut = "2.3"
kimochi-capture = { path = "../capture-core" }
reqwest = { version = "0.12", features = ["blocking", "json"] }
base64 = "0.22"
png = "0.18"
tungstenite = "0.30"
arboard = "3.6"
gilrs = "0.11"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
[target.'cfg(target_os = "macos")'.dependencies]
mangaocr = { path = "../../kimochi-mangaocr", features = ["metal"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSPanel", "NSApplication", "NSResponder"] }
objc2-foundation = "0.3"
block2 = "0.6"
[target.'cfg(target_os = "windows")'.dependencies]
# The same major as tauri/tao, so one copy of the bindings is compiled.
windows = { version = "0.61", features = [
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
[target.'cfg(target_os = "linux")'.dependencies]
# X11 desktop queries and raw key events (platform/linux), logind sleep/wake over D-Bus,
# and the GTK main-loop hop for callbacks. All already in the lock file via tauri/arboard.
x11rb = { version = "0.13", features = ["randr", "xinput", "shape"] }
zbus = "5.9"
glib = "0.18"
raw-window-handle = "0.6"
[target.'cfg(not(target_os = "macos"))'.dependencies]
# macOS coordinates instances itself (platform/macos/instance.rs).
tauri-plugin-single-instance = "2"

[features]
mangaocr-cuda = ["mangaocr/cuda"]
custom-protocol = ["tauri/custom-protocol"]
[profile.release]
strip = true
