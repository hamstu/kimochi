[package]
name = "kimochi"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
libc = "0.2"
# The OCR engines, each pinned to an exact commit so every build records the source it was made
# from (mangaocr carries GPL code). Keep the macOS, Windows and Linux mangaocr lines below on the
# same rev. To build against local checkouts, or to move a pin, see "Working on the OCR crates" in
# CONTRIBUTING.md.
meikiocr = { git = "https://github.com/hamstu/kimochi-meikiocr", rev = "7a1b9a762acbdf6b09d7386b4395c366f135733b" }
mangaocr = { git = "https://github.com/hamstu/kimochi-mangaocr", rev = "6a5dec4fd59977ca70a76255ca1ff4633aa790bd" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
# `macos-private-api` stays in this common block: tauri-build requires the common
# declaration's features to match tauri.conf.json (`macOSPrivateApi: true`), so it
# cannot move to a macOS-only block. Off macOS the feature compiles to nothing.
tauri = { version = "=2.11.5", features = [
  "devtools",
  "macos-private-api",
  "tray-icon",
  "image-png",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-http = "2.6"
tauri-plugin-global-shortcut = "2.3"
kimochi-capture = { path = "../capture-core" }
reqwest = { version = "0.12", features = ["blocking", "json"] }
base64 = "0.22"
# Verifies downloaded OCR models (model_store.rs). Already in the lock file via Tauri.
sha2 = "0.10"
# Unpacks the downloaded dictionary-engine releases (extension_store.rs): raw deflate and the zip
# CRC. Both already in the lock file (through png and image).
flate2 = "1.1"
crc32fast = "1.5"
png = "0.18"
# Google Lens OCR (google_lens.rs): its request and response are protobuf, declared by hand with
# prost's derive. Already in the lock file.
prost = "0.14"
tungstenite = "0.30"
arboard = "3.6"
gilrs = "0.11"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
# Self-updates from GitHub Releases (updater.rs): the check, the signed download and the swap.
tauri-plugin-updater = "2"
# The `kimochi://` URL scheme (account.rs): the website's "Open Kimochi" button after signing in.
tauri-plugin-deep-link = "2"
# Formats the offered release's date for the panels. Already in the lock file via the updater.
time = { version = "0.3", features = ["formatting"] }
# Redacts secrets from the debug report and its log tails (debug_report.rs). Already in the lock
# file via Tauri.
regex = "1"
# Sentence audio's listener, recogniser and clips (speech-core: Silero, SenseVoice, LAME).
kimochi-speech = { path = "../speech-core" }
[target.'cfg(target_os = "macos")'.dependencies]
mangaocr = { git = "https://github.com/hamstu/kimochi-mangaocr", rev = "6a5dec4fd59977ca70a76255ca1ff4633aa790bd", features = ["metal"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSPanel", "NSApplication", "NSResponder"] }
objc2-foundation = "0.3"
block2 = "0.6"
[target.'cfg(target_os = "windows")'.dependencies]
# Manga OCR on ONNX Runtime with DirectML (manga_ocr.rs); keep on the common line's rev.
mangaocr = { git = "https://github.com/hamstu/kimochi-mangaocr", rev = "6a5dec4fd59977ca70a76255ca1ff4633aa790bd", features = ["directml"] }
# The same major as tauri/tao, so one copy of the bindings is compiled.
windows = { version = "0.61", features = [
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
[target.'cfg(target_os = "linux")'.dependencies]
# Manga OCR on ONNX Runtime's CPU kernels (manga_ocr.rs); keep on the common line's rev.
mangaocr = { git = "https://github.com/hamstu/kimochi-mangaocr", rev = "6a5dec4fd59977ca70a76255ca1ff4633aa790bd", features = ["onnx"] }
# X11 desktop queries (platform/linux), logind sleep/wake over D-Bus, and the GTK
# main-loop hop for callbacks. All already in the lock file via tauri/arboard.
x11rb = { version = "0.13", features = ["randr", "shape"] }
zbus = "5.9"
glib = "0.18"
raw-window-handle = "0.6"
# Hidden-page timer throttling off in every webview (platform/linux/webkit_timers.rs); the
# version wry already uses.
webkit2gtk = "2.0"
[target.'cfg(not(target_os = "macos"))'.dependencies]
# macOS coordinates instances itself (platform/macos/instance.rs).
# `deep-link`: a second launch carrying a `kimochi://` URL hands it to the running copy.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[features]
mangaocr-cuda = ["mangaocr/cuda"]
custom-protocol = ["tauri/custom-protocol"]
[lints.clippy]
# Stylistic (Rust 1.99): `chunks_exact(4)` says "one RGBA pixel" more plainly than
# `as_chunks::<4>().0`, and several Windows/Linux pixel loops are written that way.
chunks_exact_to_as_chunks = "allow"

[profile.release]
strip = true

# Manga OCR's arithmetic (Candle, its gemm kernels and the crate's own loops) is optimized in
# development builds too. Unoptimized, one CPU scan ran for minutes, holding Auto OCR's scan
# lock; dev builds and `npm run bundle`'s debug installer are where scans get tested.
[profile.dev.package.mangaocr]
opt-level = 3
[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
[profile.dev.package.gemm-f16]
opt-level = 3
[profile.dev.package.pulp]
opt-level = 3
[profile.dev.package.half]
opt-level = 3
[profile.dev.package.libm]
opt-level = 3
