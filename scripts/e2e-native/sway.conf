# Headless Sway for the ext driver tests (run.sh). HEADLESS-1 exists at start; run.sh adds
# HEADLESS-2 with `swaymsg create_output`, which picks up the line below.
output HEADLESS-1 mode 1920x1080 position 0 0 bg #203040 solid_color
output HEADLESS-2 mode 1280x720 position 1920 0 bg #402030 solid_color
default_border pixel 2
focus_follows_mouse no
