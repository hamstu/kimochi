[package]
name = "kimochi-hookd"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Kimochi's text-hook sidecar: hosts LunaHook (or drives TextractorCLI) outside the app."

[[bin]]
name = "kimochi-hookd"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
] }

[profile.release]
strip = true
opt-level = "s"
lto = true
panic = "abort"
