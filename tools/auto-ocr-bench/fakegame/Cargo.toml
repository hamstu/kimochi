[package]
name = "fakegame"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fakegame"
path = "src/main.rs"

[[bin]]
name = "w32"
path = "src/bin/w32.rs"

[dependencies]
serde_json = "1"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input", "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D",
  "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Pipes",
  "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security", "Win32_System_Threading",
  "Win32_Graphics_Dwm", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp",
  "Win32_Devices_Display", "Win32_System_Performance",
]

[profile.dev]
opt-level = 1
