[package]
name = "ocrbench"
version = "0.1.0"
edition = "2021"

[dependencies]
meikiocr = { git = "https://github.com/hamstu/kimochi-meikiocr", rev = "7a1b9a762acbdf6b09d7386b4395c366f135733b" }
ppocr = { git = "https://github.com/hamstu/kimochi-ppocr", rev = "2972b089c1e9d00b6354a42b555c6f549df26a1f" }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
debug = false
