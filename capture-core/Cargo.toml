[package]
name = "kimochi-capture"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
png = "0.18"
rtrb = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "=10.0.3", features = ["macos_14_0"] }
objc2 = "0.6"
# The local text observer builds an NSImage straight from captured pixels and
# drives VisionKitCore's analyzer, which is reached by dlopen and runtime lookup
# rather than by linking: see src/text/livetext.rs.
objc2-app-kit = { version = "0.3", features = [
  "NSBitmapImageRep",
  "NSImage",
  "NSImageRep",
  "NSGraphics",
  # Only the tests use these: they render Japanese fixtures with the system's own
  # fonts, so the observer can be proved against real glyphs without downloading
  # an asset or shipping one.
  "NSStringDrawing",
  "NSGraphicsContext",
  "NSFont",
  "NSColor",
  "NSParagraphStyle",
  "NSAttributedString",
] }
objc2-foundation = { version = "0.3", features = [
  "NSArray",
  "NSString",
  "NSValue",
  "NSDictionary",
  "NSAttributedString",
  "NSGeometry",
] }
block2 = "0.6"

# Windows Graphics Capture through `windows-capture`, plus the Win32 calls the source
# catalog makes itself (window styles, DWM cloaking and frame bounds, monitor rects,
# process image names). `windows` is pinned to the minor `windows-capture` builds on,
# so HWND/HMONITOR are the same types on both sides.
[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "2"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  # System audio (src/audio/windows.rs): WASAPI loopback, its COM plumbing and QPC timestamps.
  "Win32_Devices_FunctionDiscovery",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_Security",
  "Win32_System_Performance",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
] }
# `#[implement]` (the process-loopback activation's completion handler) expands to windows_core
# paths. The version `windows` 0.62 uses.
windows-core = "0.62"

# X11 capture and desktop metadata over the pure-Rust protocol crate: no libxcb, no
# pkg-config. Wayland capture is the ScreenCast portal (ashpd, on zbus's async-io
# runtime like the app's own zbus, so no tokio context is needed) plus a PipeWire
# stream; `pipewire` generates bindings at build time, so Linux builds need
# libpipewire-0.3-dev (and libspa-0.2-dev) plus libclang.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }
ashpd = { version = "0.13", default-features = false, features = ["screencast", "async-io"] }
pipewire = "0.10"
async-io = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# A main-thread harness: VisionKit delivers its completion to the main queue, so a
# test that runs on a spawned harness thread can never see it.
[[test]]
name = "livetext"
harness = false
