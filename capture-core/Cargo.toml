[package]
name = "kimochi-capture"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
png = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "=10.0.3", features = ["macos_14_0"] }
objc2 = "0.6"
# The local text observer builds an NSImage straight from captured pixels and
# drives VisionKitCore's analyzer, which is reached by dlopen and runtime lookup
# rather than by linking: see src/text/livetext.rs.
objc2-app-kit = { version = "0.3", features = [
  "NSBitmapImageRep",
  "NSImage",
  "NSImageRep",
  "NSGraphics",
  # Only the tests use these: they render Japanese fixtures with the system's own
  # fonts, so the observer can be proved against real glyphs without downloading
  # an asset or shipping one.
  "NSStringDrawing",
  "NSGraphicsContext",
  "NSFont",
  "NSColor",
  "NSParagraphStyle",
  "NSAttributedString",
] }
objc2-foundation = { version = "0.3", features = [
  "NSArray",
  "NSString",
  "NSValue",
  "NSDictionary",
  "NSAttributedString",
  "NSGeometry",
] }
block2 = "0.6"

# Windows Graphics Capture through `windows-capture`, plus the Win32 calls the source
# catalog makes itself (window styles, DWM cloaking and frame bounds, monitor rects,
# process image names). `windows` is pinned to the minor `windows-capture` builds on,
# so HWND/HMONITOR are the same types on both sides.
[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "2"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
] }

# X11 capture and desktop metadata over the pure-Rust protocol crate: no libxcb, no
# pkg-config, so Linux builds and cross-checks need no X11 -dev packages. Wayland
# (portal + PipeWire) is Phase 7 and adds its own dependencies then.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }

# A main-thread harness: VisionKit delivers its completion to the main queue, so a
# test that runs on a spawned harness thread can never see it.
[[test]]
name = "livetext"
harness = false
