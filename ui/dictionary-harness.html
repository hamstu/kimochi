<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Browser integration harness for the generic extension host (DICTIONARY_ENGINES.md §9).
      Served by the dev server: http://127.0.0.1:1430/ui/dictionary-harness.html?engine=hachidori
      (or ?engine=tenten, or ?engine=yomitan for the Yomitan shim at the app origin, §11.5;
      ?hachidori=…&tenten=… override the extension origins; ?scope=<selector> starts the content
      scripts with that scan scope, e.g. ?scope=%5Bdata-yomitan-scan%5D).
      Order matters: the native stand-in (dictionary-harness-native.js: __TAURI__, the relay bus,
      plugin-http) and the harness prelude (engine mirror, origins) must run before the hosts.
      Both hosts load, as native injects both; exactly one installs for the mirrored engine.
      Hachidori and 10ten open their extension window's page on the extension port (§5.4).
    -->
    <script src="dictionary-harness-native.js"></script>
    <script src="dictionary-harness.js"></script>
    <script src="/spike/ext-host.js"></script>
    <script src="/spike/shim.js"></script>
    <title>Dictionary engine harness</title>
    <style>
      :root { color-scheme: light; font: 15px -apple-system, system-ui, "Segoe UI", sans-serif; }
      body { margin: 0; background: #fff; color: #162824; }
      header { background: #153c32; color: #fff; padding: 10px 16px; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
      header h1 { font-size: 16px; margin: 0; }
      header code { color: #bfe3d6; }
      main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 16px; }
      @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
      section { min-width: 0; }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: #4b635c; margin: 0 0 6px; }
      #fixture p { font-size: 38px; line-height: 1.6; margin: 6px 0; }
      #controls { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
      button { font: inherit; padding: 6px 10px; }
      pre { background: #f3f6f5; border: 1px solid #d5dfdb; padding: 8px; overflow: auto; font: 12px ui-monospace, Menlo, monospace; margin: 0; }
      #status { min-height: 2.5em; }
      #log { height: 320px; white-space: pre-wrap; word-break: break-word; }
      #options { width: 100%; height: 520px; border: 1px solid #d5dfdb; display: block; }
      #popup-outline { position: fixed; pointer-events: none; outline: 2px dashed #e0457b; display: none; z-index: 2147483646; }
    </style>
  </head>
  <body>
    <header>
      <h1>Dictionary engine harness</h1>
      <span>engine <code id="engine">?</code></span>
      <span>origin <code id="origin">?</code></span>
      <span>start <code id="ready" data-state="pending">pending</code></span>
    </header>
    <main>
      <section>
        <h2>Fixture (scannable)</h2>
        <div id="fixture">
          <!--
            The first character of 猫 and 食べました is its own span so a devtools "hover" (which
            points at an element's centre) lands on the word's first character rather than past
            the end of the line. #target carries data-yomitan-scan, the Log's scan scope, so
            ?scope=[data-yomitan-scan] leaves 猫 outside the scope and 食べました inside it.
          -->
          <p><span id="hover-neko" title="hover 猫">猫</span>が好きです。</p>
          <p>日本語を勉強しています。</p>
          <p id="target" data-yomitan-scan><span id="hover-taberu" title="hover 食べました">食</span>べました。</p>
        </div>
        <div id="controls">
          <button id="lookup">lookup 食べました</button>
          <button id="next">next entry</button>
          <button id="prev">prev entry</button>
          <button id="scroll">scroll</button>
          <button id="dismiss">dismiss</button>
          <button id="open-options">open options page</button>
          <button id="action">toolbar action (toggle)</button>
          <button id="reset">reset harness storage + reload</button>
        </div>
        <h2>Start result / popup</h2>
        <pre id="status">waiting for start()…</pre>
        <h2>Host reports</h2>
        <pre id="log"></pre>
      </section>
      <section>
        <h2>Options page</h2>
        <iframe id="options" title="Engine options page"></iframe>
      </section>
    </main>
    <div id="popup-outline"></div>
  </body>
</html>
