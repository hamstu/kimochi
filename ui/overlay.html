<!doctype html>
<html>
  <meta charset="utf-8" /><title>Kimochi OCR Overlay</title
  ><style>
    html,
    body {
      margin: 0;
      background: transparent !important;
      overflow: hidden;
    }
    #backend {
      display: none;
    }
    #words {
      position: absolute;
      inset: 0;
    }
    /* The recognised text itself (word boxes, grouped regions) is styled in overlay-text.css,
       which Settings' look previews share. */

    /* --- hover markings ---------------------------------------------------
       Passive outlines showing what a scan will cover. Never interactive, so
       they are deliberately absent from the click-through hit regions. */
    #hover {
      position: absolute;
      inset: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }
    #hover > div {
      position: absolute;
      border-radius: 8px;
      box-sizing: border-box;
      pointer-events: none;
    }
    .hover-window {
      border: 3px solid #3b82f6;
      background: rgba(59, 130, 246, 0.06);
      box-shadow:
        0 0 20px rgba(59, 130, 246, 0.5),
        0 0 40px rgba(59, 130, 246, 0.25),
        inset 0 0 30px rgba(59, 130, 246, 0.1);
    }
    /* The hovered window's own pixels, at its exact on-screen box (beneath the
       outline, whose border sits just outside it). Fades in once decoded. */
    #hover > .hover-window-image {
      position: absolute;
      display: block;
      box-sizing: border-box;
      border-radius: 5px;
      object-fit: fill;
      pointer-events: none;
      user-select: none;
      opacity: 0;
      /* The blur stays inside the window's box rather than feathering past it. */
      clip-path: inset(0 round 5px);
      transition:
        opacity 0.35s ease-out,
        filter 0.45s ease-out;
    }
    #hover > .hover-window-image.loaded {
      opacity: 1;
    }
    /* The last picture, while a fresh one is captured: it may be out of date, so blurred. */
    #hover > .hover-window-image.stale {
      filter: blur(14px) saturate(0.85);
    }
    /* Bringing the window to the front: the markings zoom, blur and fade about the
       window's centre (each element is placed at the window's box). */
    #hover > .dissipate {
      transform-origin: center;
      animation: hover-dissipate 0.28s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes hover-dissipate {
      to {
        opacity: 0;
        transform: scale(1.07);
        filter: blur(12px);
      }
    }
    /* The OCR crop, in the region editor's blue (green is the Anki crop's colour). */
    .hover-crop {
      border: 3px solid #5b7bf0;
      background: rgba(91, 123, 240, 0.06);
      box-shadow:
        0 0 20px rgba(91, 123, 240, 0.5),
        0 0 40px rgba(91, 123, 240, 0.25),
        inset 0 0 30px rgba(91, 123, 240, 0.1);
    }

    /* --- scanning placeholders ------------------------------------------- */
    .ocr-skeleton {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .skeleton-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }
    .skeleton {
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(255, 255, 255, 0.28) 50%,
        rgba(255, 255, 255, 0.12) 100%
      );
      background-size: 200% 100%;
      animation: text-overlay-shimmer 1.5s ease-in-out infinite;
    }
    @keyframes text-overlay-shimmer {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }

    /* Toggled from the controller: draws the real hit rectangles. */
    .debug .ocr-word,
    .debug .ocr-group,
    .debug .ocr-skeleton {
      outline: 1px solid #e83596;
      background: #e8359610;
    }

    /* Fallback only: used when no native Yomitan settings window exists. */
    .pages {
      position: absolute;
      left: 5%;
      top: 5%;
      width: 90%;
      height: 90%;
      background: white;
      border-radius: 10px;
      box-shadow: 0 12px 60px #0005;
      overflow: hidden;
    }
    .pages[hidden] {
      display: none;
    }
    .pages header {
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font: 15px -apple-system, system-ui, "Segoe UI", sans-serif;
      background: #eaf1e6;
    }
    .pages strong {
      flex: 1;
    }
    .pages button {
      padding: 8px 18px;
    }
    #extension-page {
      border: 0;
      width: 100%;
      height: calc(100% - 44px);
    }
  </style>
  <link rel="stylesheet" href="overlay-text.css">
  <link rel="stylesheet" href="controller.css">
  <link rel="stylesheet" href="controller-variants.css">
  <link rel="stylesheet" href="game-dictionary.css">
  <link rel="stylesheet" href="fonts/manga.css">
  <link rel="stylesheet" href="fonts/figtree.css">
  <body>
    <div id="words"></div>
    <div id="hover"></div>
    <div id="controller" data-cm-variant="halo"></div>
    <section class="pages" hidden>
      <header>
        <strong>Original Yomitan settings &amp; dictionary import</strong
        ><button id="close">Close</button>
      </header>
      <iframe id="extension-page" title="Original Yomitan settings"></iframe>
    </section>
    <script type="module" src="overlay.js"></script>
  </body>
</html>
