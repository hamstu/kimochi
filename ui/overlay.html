<!doctype html>
<html>
  <meta charset="utf-8" /><title>Kimochi OCR Overlay</title
  ><style>
    html,
    body {
      margin: 0;
      background: transparent !important;
      overflow: hidden;
    }
    #backend {
      display: none;
    }
    #words {
      position: absolute;
      inset: 0;
    }

    /* --- per-word mode ---------------------------------------------------
       Transparent boxes sitting exactly over the source's own glyphs. They
       stay invisible until the pointer is near, so the source text is never
       obscured by our copy of it. The text inside is fitted over the source
       glyphs (text-layout.js) and set in the font it was measured in, and
       hovering never moves or scales it. */
    .ocr-word {
      position: absolute;
      display: inline-flex;
      align-items: flex-start;
      overflow: hidden;
      white-space: nowrap;
      text-align: left;
      color: white;
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Noto Sans CJK JP',
        'Yu Gothic', 'Meiryo', sans-serif;
      font-weight: bold;
      font-kerning: none;
      cursor: default;
      border-radius: 6px 6px 0 0;
      transition:
        background-color 0.1s ease-in-out,
        border-bottom 0.1s ease-in-out,
        opacity 0.1s ease-in-out,
        color 0.1s ease-in-out;
    }
    .ocr-word-text {
      opacity: 0;
    }
    /* Top-aligned, so it starts at the box's top (or, vertical, its right) edge whatever the
       line around it; `render.js` offsets it from there to where the fit puts its glyphs. */
    .ocr-word-current {
      display: inline-block;
      position: relative;
      vertical-align: top;
      text-align: left;
    }
    /* A block's lines (a paragraph or bubble read as several lines): zero-size inline blocks,
       each offset from the box's corner to its line. Inline, not absolutely positioned, so the
       box's text stays one flow Yomitan's scanner reads through from line to line (an absolute
       element ends a scan, see `.ocr-lookahead`); zero-size, so where each flows is known. */
    .ocr-word .ocr-run {
      display: inline-block;
      position: relative;
      width: 0;
      height: 0;
      vertical-align: top;
    }

    /* --- grouped mode ----------------------------------------------------
       One opaque card per cluster, replacing the source text rather than
       overlaying it, for sources whose own typography is hard to read. */
    .ocr-group {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      white-space: pre;
      text-align: center;
      padding: 6px 8px;
      border-radius: 8px;
      cursor: pointer;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: bold;
      color: #14181c;
      background: rgba(228, 243, 255, var(--backdrop-opacity, 0.8));
      border: 1px solid #0b192233;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    .ocr-group.scanning {
      cursor: default;
    }
    /* Lookahead: the following words' text, after the hovered word, for a lookup to
       run into when OCR split a word (render.js). It has to satisfy two readers.

       Yomitan's `DOMTextScanner` (yomitan/js/dom/dom-text-scanner.js) only enters an
       element whose computed style `isStyleVisible` accepts: `visibility` not hidden,
       `opacity` > 0, `font-size` > 0, and not a transparent colour unless selectable.
       It also turns `position: absolute|fixed|sticky` into two newlines and a block,
       flex, grid, list-item or table display into one, either of which ends the match.
       `opacity: 0` and `font-size: 0` were exactly what kept every split word from
       being found.

       Yomitan's popup is placed from `Range.getClientRects()` of the match, so this
       text must contribute no rectangle with area, or the popup follows the following
       words. Clipping (`clip-path`, `overflow: hidden`, a zero-width box) only stops
       painting; the text keeps its full-size rectangles.

       `transform: scale(0)` does both. Every computed style the scanner reads stays
       ordinary, `inline-block` is not a layout-changing display to it, and a degenerate
       transform collapses every client rectangle of the text to a point: nothing is
       painted, nothing hit-tests, and the popup host drops zero-area source rectangles
       (`withExtent` in popup-geometry.ts). The zero-size box keeps the line from
       growing. Transforms need a non-inline box, hence `inline-block`. */
    .ocr-lookahead {
      display: inline-block;
      width: 0;
      height: 0;
      overflow: hidden;
      vertical-align: top;
      transform: scale(0);
    }
    .ocr-group .ocr-lookahead {
      position: absolute;
    }
    /* A selection that ran past its box (食べ|ました looked up from 食べ). The box it
       started in shows the whole word and the boxes whose text it took are hidden
       under it; see `applySelectionMarks` in render.js, which sets these attributes.

       The extension is pseudo-element content, `attr(data-ext)`, never a text node:
       Yomitan's scanner walks DOM text, so on the next hover it still reads the box's
       own text and then its lookahead, as if nothing were shown. The box and its text
       span grow along the reading axis (width when horizontal, height when vertical)
       from the size OCR gave them, anchored at their start, so the stem stays over
       the source glyphs and the extension runs on over the hidden boxes. `!important`
       beats the inline sizes `renderWords` sets; `updateProximity` rewrites other
       inline styles every frame and leaves these alone. Attributes rather than classes
       because `render` matches a nudged box on its class name. */
    .ocr-word[data-extended] {
      width: auto !important;
      min-width: var(--ocr-width);
      z-index: 1;
    }
    .ocr-word.ocr-vertical[data-extended] {
      width: var(--ocr-width) !important;
      height: auto !important;
      min-height: var(--ocr-height);
    }
    .ocr-word-current[data-ext] {
      width: auto !important;
      min-width: var(--ocr-width);
    }
    .ocr-vertical .ocr-word-current[data-ext] {
      width: auto !important;
      min-width: 0;
      height: auto !important;
      min-height: var(--ocr-height);
    }
    .ocr-word-current[data-ext]::after {
      content: attr(data-ext);
    }
    /* Hidden, not transparent: a hidden box takes no pointer events and leaves the
       click-through regions (`hitRects`), which the extended box over it now covers. */
    .ocr-word[data-consumed] {
      visibility: hidden !important;
    }
    /* Each run sits over the line or word it was read from; see text-layout.js. Glyphs are
       centred across the run by its line height (and its offset), and placed along it by its
       offset and letter spacing. */
    .ocr-run {
      white-space: nowrap;
      text-align: left;
      overflow: visible;
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Noto Sans CJK JP',
        'Yu Gothic', 'Meiryo', sans-serif;
      font-kerning: none;
    }
    /* Manga OCR's text, in the bundled manga face (MANGA_FONT in render.js; fonts/manga.css). Its
       weight is set per run, heavier for text big for its page. */
    .ocr-manga,
    .ocr-manga .ocr-run {
      font-family: 'Zen Kaku Gothic Antique', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN',
        'Noto Sans JP', 'Noto Sans CJK JP', 'Yu Gothic', 'Meiryo', sans-serif;
      font-weight: 500;
    }
    .ocr-group .ocr-run {
      position: absolute;
      box-sizing: border-box;
    }
    .ocr-vertical .ocr-run {
      writing-mode: vertical-rl;
      text-orientation: mixed;
    }

    /* --- hover markings ---------------------------------------------------
       Passive outlines showing what a scan will cover. Never interactive, so
       they are deliberately absent from the click-through hit regions. */
    #hover {
      position: absolute;
      inset: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }
    #hover > div {
      position: absolute;
      border-radius: 8px;
      box-sizing: border-box;
      pointer-events: none;
    }
    .hover-window {
      border: 3px solid #3b82f6;
      background: rgba(59, 130, 246, 0.06);
      box-shadow:
        0 0 20px rgba(59, 130, 246, 0.5),
        0 0 40px rgba(59, 130, 246, 0.25),
        inset 0 0 30px rgba(59, 130, 246, 0.1);
    }
    /* The hovered window's own pixels, at its exact on-screen box (beneath the
       outline, whose border sits just outside it). Fades in once decoded. */
    #hover > .hover-window-image {
      position: absolute;
      display: block;
      box-sizing: border-box;
      border-radius: 5px;
      object-fit: fill;
      pointer-events: none;
      user-select: none;
      opacity: 0;
      /* The blur stays inside the window's box rather than feathering past it. */
      clip-path: inset(0 round 5px);
      transition:
        opacity 0.35s ease-out,
        filter 0.45s ease-out;
    }
    #hover > .hover-window-image.loaded {
      opacity: 1;
    }
    /* The last picture, while a fresh one is captured: it may be out of date, so blurred. */
    #hover > .hover-window-image.stale {
      filter: blur(14px) saturate(0.85);
    }
    /* Bringing the window to the front: the markings zoom, blur and fade about the
       window's centre (each element is placed at the window's box). */
    #hover > .dissipate {
      transform-origin: center;
      animation: hover-dissipate 0.28s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes hover-dissipate {
      to {
        opacity: 0;
        transform: scale(1.07);
        filter: blur(12px);
      }
    }
    /* The OCR crop, in the region editor's blue (green is the Anki crop's colour). */
    .hover-crop {
      border: 3px solid #5b7bf0;
      background: rgba(91, 123, 240, 0.06);
      box-shadow:
        0 0 20px rgba(91, 123, 240, 0.5),
        0 0 40px rgba(91, 123, 240, 0.25),
        inset 0 0 30px rgba(91, 123, 240, 0.1);
    }

    /* --- scanning placeholders ------------------------------------------- */
    .ocr-skeleton {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .skeleton-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }
    .skeleton {
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(255, 255, 255, 0.28) 50%,
        rgba(255, 255, 255, 0.12) 100%
      );
      background-size: 200% 100%;
      animation: text-overlay-shimmer 1.5s ease-in-out infinite;
    }
    @keyframes text-overlay-shimmer {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }

    @media (prefers-color-scheme: dark) {
      .ocr-group {
        color: #edeff2;
        background: rgba(17, 17, 17, var(--backdrop-opacity, 0.8));
        border-color: rgb(172 184 223 / 18%);
      }
    }

    .ocr-word::selection,
    .ocr-word-current::selection,
    .ocr-group::selection {
      background: #85b2ff99;
      color: #132113;
    }

    /* Toggled from the controller: draws the real hit rectangles. */
    .debug .ocr-word,
    .debug .ocr-group,
    .debug .ocr-skeleton {
      outline: 1px solid #e83596;
      background: #e8359610;
    }

    /* Fallback only: used when no native Yomitan settings window exists. */
    .pages {
      position: absolute;
      left: 5%;
      top: 5%;
      width: 90%;
      height: 90%;
      background: white;
      border-radius: 10px;
      box-shadow: 0 12px 60px #0005;
      overflow: hidden;
    }
    .pages[hidden] {
      display: none;
    }
    .pages header {
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font: 15px -apple-system, system-ui, "Segoe UI", sans-serif;
      background: #eaf1e6;
    }
    .pages strong {
      flex: 1;
    }
    .pages button {
      padding: 8px 18px;
    }
    #extension-page {
      border: 0;
      width: 100%;
      height: calc(100% - 44px);
    }
  
      .ocr-vertical, .ocr-vertical .ocr-word-current {
        writing-mode: vertical-rl;
        text-orientation: mixed;
      }
      .ocr-word.ocr-vertical { padding: 0; align-items: stretch; }
      .ocr-vertical .ocr-word-text { width: 100%; height: 100%; }
      .ocr-group.ocr-vertical { white-space: pre-wrap; overflow-wrap: anywhere; }

  </style>
  <link rel="stylesheet" href="controller.css">
  <link rel="stylesheet" href="controller-variants.css">
  <link rel="stylesheet" href="game-dictionary.css">
  <link rel="stylesheet" href="fonts/manga.css">
  <link rel="stylesheet" href="fonts/figtree.css">
  <body>
    <div id="words"></div>
    <div id="hover"></div>
    <div id="controller" data-cm-variant="halo"></div>
    <section class="pages" hidden>
      <header>
        <strong>Original Yomitan settings &amp; dictionary import</strong
        ><button id="close">Close</button>
      </header>
      <iframe id="extension-page" title="Original Yomitan settings"></iframe>
    </section>
    <script type="module" src="overlay.js"></script>
  </body>
</html>
