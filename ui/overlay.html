<!doctype html>
<html>
  <meta charset="utf-8" /><title>Kimochi OCR Overlay</title
  ><style>
    html,
    body {
      margin: 0;
      background: transparent !important;
      overflow: hidden;
    }
    #backend {
      display: none;
    }
    #words {
      position: absolute;
      inset: 0;
    }

    /* --- per-word mode ---------------------------------------------------
       Transparent boxes sitting exactly over the source's own glyphs. They
       stay invisible until the pointer is near, so the source text is never
       obscured by our copy of it. */
    .ocr-word {
      position: absolute;
      display: inline-flex;
      align-items: flex-start;
      overflow: hidden;
      white-space: nowrap;
      text-align: left;
      padding-left: 2px;
      color: white;
      font-family: sans-serif;
      font-weight: bold;
      cursor: default;
      border-radius: 6px 6px 0 0;
      transition:
        background-color 0.1s ease-in-out,
        border-bottom 0.1s ease-in-out,
        opacity 0.1s ease-in-out,
        color 0.1s ease-in-out,
        transform 0.1s ease-in-out;
    }
    .ocr-word-text {
      opacity: 0;
    }
    .ocr-word-current {
      display: inline-block;
      text-align: left;
    }

    /* --- grouped mode ----------------------------------------------------
       One opaque card per cluster, replacing the source text rather than
       overlaying it, for sources whose own typography is hard to read. */
    .ocr-group {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      white-space: pre;
      text-align: center;
      padding: 6px 8px;
      border-radius: 8px;
      cursor: pointer;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: bold;
      color: #14181c;
      background: rgba(228, 243, 255, var(--backdrop-opacity, 0.8));
      border: 1px solid #0b192233;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    .ocr-group.scanning {
      cursor: default;
    }
    /* Lookahead context for the dictionary scanner: in the DOM, never seen, and
       deliberately without geometry. Yomitan positions the popup from the client
       rectangles of the matched range, so text the reader is not pointing at must
       not contribute any. `DOMTextScanner` reads content and computed display, not
       rectangles, so the scanner still runs straight through it. */
    .ocr-lookahead {
      font-size: 0;
      line-height: 0;
      opacity: 0;
    }
    .ocr-group .ocr-lookahead {
      position: absolute;
    }
    /* Each run sits over the line or word it was read from; see text-layout.js. Glyphs are
       centred across the run by its line height and along it by letter spacing. */
    .ocr-group .ocr-run {
      position: absolute;
      box-sizing: border-box;
      white-space: nowrap;
      text-align: left;
      overflow: visible;
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Noto Sans CJK JP',
        'Yu Gothic', 'Meiryo', sans-serif;
      font-kerning: none;
    }
    .ocr-group.ocr-vertical .ocr-run {
      writing-mode: vertical-rl;
      text-orientation: mixed;
    }

    /* --- hover markings ---------------------------------------------------
       Passive outlines showing what a scan will cover. Never interactive, so
       they are deliberately absent from the click-through hit regions. */
    #hover {
      position: absolute;
      inset: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }
    #hover > div {
      position: absolute;
      border-radius: 8px;
      box-sizing: border-box;
      pointer-events: none;
    }
    .hover-window {
      border: 3px solid #3b82f6;
      background: rgba(59, 130, 246, 0.06);
      box-shadow:
        0 0 20px rgba(59, 130, 246, 0.5),
        0 0 40px rgba(59, 130, 246, 0.25),
        inset 0 0 30px rgba(59, 130, 246, 0.1);
    }
    /* The hovered window's own pixels, at its exact on-screen box (beneath the
       outline, whose border sits just outside it). Fades in once decoded. */
    #hover > .hover-window-image {
      position: absolute;
      display: block;
      box-sizing: border-box;
      border-radius: 5px;
      object-fit: fill;
      pointer-events: none;
      user-select: none;
      opacity: 0;
      transition: opacity 0.18s ease-out;
    }
    #hover > .hover-window-image.loaded {
      opacity: 1;
    }
    /* Bringing the window to the front: the markings zoom, blur and fade about the
       window's centre (each element is placed at the window's box). */
    #hover > .dissipate {
      transform-origin: center;
      animation: hover-dissipate 0.28s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes hover-dissipate {
      to {
        opacity: 0;
        transform: scale(1.07);
        filter: blur(12px);
      }
    }
    .hover-crop {
      border: 3px solid #22c55e;
      background: rgba(34, 197, 94, 0.06);
      box-shadow:
        0 0 20px rgba(34, 197, 94, 0.5),
        0 0 40px rgba(34, 197, 94, 0.25),
        inset 0 0 30px rgba(34, 197, 94, 0.1);
    }

    /* --- scanning placeholders ------------------------------------------- */
    .ocr-skeleton {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .skeleton-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }
    .skeleton {
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(255, 255, 255, 0.28) 50%,
        rgba(255, 255, 255, 0.12) 100%
      );
      background-size: 200% 100%;
      animation: text-overlay-shimmer 1.5s ease-in-out infinite;
    }
    @keyframes text-overlay-shimmer {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }

    @media (prefers-color-scheme: dark) {
      .ocr-group {
        color: #edeff2;
        background: rgba(17, 17, 17, var(--backdrop-opacity, 0.8));
        border-color: rgb(172 184 223 / 18%);
      }
    }

    .ocr-word::selection,
    .ocr-word-current::selection,
    .ocr-group::selection {
      background: #85b2ff99;
      color: #132113;
    }

    /* Toggled from the controller: draws the real hit rectangles. */
    .debug .ocr-word,
    .debug .ocr-group,
    .debug .ocr-skeleton {
      outline: 1px solid #e83596;
      background: #e8359610;
    }

    /* Fallback only: used when no native Yomitan settings window exists. */
    .pages {
      position: absolute;
      left: 5%;
      top: 5%;
      width: 90%;
      height: 90%;
      background: white;
      border-radius: 10px;
      box-shadow: 0 12px 60px #0005;
      overflow: hidden;
    }
    .pages[hidden] {
      display: none;
    }
    .pages header {
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font: 15px -apple-system;
      background: #eaf1e6;
    }
    .pages strong {
      flex: 1;
    }
    .pages button {
      padding: 8px 18px;
    }
    #extension-page {
      border: 0;
      width: 100%;
      height: calc(100% - 44px);
    }
  
      .ocr-vertical, .ocr-vertical .ocr-word-current {
        writing-mode: vertical-rl;
        text-orientation: mixed;
      }
      .ocr-word.ocr-vertical { padding: 0; align-items: stretch; }
      .ocr-vertical .ocr-word-text { width: 100%; height: 100%; }
      .ocr-word.ocr-block .ocr-word-current { white-space: pre-wrap; overflow-wrap: anywhere; }
      .ocr-group.ocr-vertical { white-space: pre-wrap; overflow-wrap: anywhere; }

    /* --- controller mode ---------------------------------------------------
       The radial menu and the word cursor. Drawn over a game, so they bring
       their own dark glass rather than borrowing the source's colours, and
       they animate in and out quickly: the reader is mid-game. */
    #controller {
      position: absolute;
      inset: 0;
      pointer-events: none;
      --cm-accent: #7dd3fc;
      --cm-accent-rgb: 125, 211, 252;
      --cm-ink: rgba(255, 255, 255, 0.92);
      --cm-dim: rgba(255, 255, 255, 0.55);
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: var(--cm-ink);
      -webkit-font-smoothing: antialiased;
    }
    .cm-root {
      position: absolute;
      inset: 0;
    }
    .cm-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.5));
      animation: cm-fade 0.24s ease-out both;
    }
    .cm-ring {
      position: absolute;
      width: var(--cm-size);
      height: var(--cm-size);
      transform: translate(-50%, -50%);
      animation: cm-in 0.34s cubic-bezier(0.16, 1.3, 0.3, 1) both;
    }
    .cm-glass {
      position: absolute;
      left: 50%;
      top: 50%;
      width: calc(var(--cm-radius) * 2 + 28px);
      height: calc(var(--cm-radius) * 2 + 28px);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(14, 17, 28, 0.86) 40%, rgba(14, 17, 28, 0.7));
      backdrop-filter: blur(18px) saturate(1.5);
      -webkit-backdrop-filter: blur(18px) saturate(1.5);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.55),
        inset 0 0 0 1px rgba(255, 255, 255, 0.07),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    .cm-wedges {
      position: absolute;
      inset: 0;
      overflow: visible;
    }
    .cm-track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 1;
    }
    .cm-ticks {
      fill: none;
      stroke: var(--cm-accent);
      stroke-width: 5;
      stroke-dasharray: 1 11;
      opacity: 0.45;
      animation: cm-spin 60s linear infinite;
    }
    .cm-disc {
      fill: rgba(0, 0, 0, 0.35);
      stroke: rgba(255, 255, 255, 0.08);
    }
    .cm-wedge {
      fill: rgba(255, 255, 255, 0.035);
      stroke: rgba(255, 255, 255, 0.07);
      stroke-width: 1;
      pointer-events: visiblePainted;
      cursor: pointer;
      transition:
        fill 0.14s ease,
        stroke 0.14s ease,
        filter 0.14s ease;
    }
    .cm-wedge.cm-selected {
      fill: url(#cm-glow);
      stroke: rgba(var(--cm-accent-rgb), 0.85);
      filter: drop-shadow(0 0 14px rgba(var(--cm-accent-rgb), 0.55));
    }
    .cm-wedge.cm-disabled {
      cursor: default;
    }
    .cm-wedge.cm-selected.cm-disabled {
      fill: rgba(255, 255, 255, 0.06);
      stroke: rgba(255, 255, 255, 0.25);
      filter: none;
    }
    .cm-wedge.cm-chosen {
      animation: cm-flash 0.22s ease-out;
    }
    .cm-pointer {
      fill: var(--cm-accent);
      opacity: 0;
      filter: drop-shadow(0 0 6px var(--cm-accent));
      transition:
        transform 0.06s linear,
        opacity 0.12s ease;
    }
    .cm-item {
      position: absolute;
      left: 50%;
      top: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 96px;
      pointer-events: none;
      color: var(--cm-dim);
      transform: translate(-50%, -50%) translate(var(--x), var(--y));
      animation: cm-item-in 0.36s cubic-bezier(0.16, 1.2, 0.3, 1) both;
      animation-delay: calc(var(--i) * 40ms + 70ms);
      transition: color 0.14s ease;
    }
    .cm-icon {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      transition:
        transform 0.18s cubic-bezier(0.2, 1.4, 0.4, 1),
        box-shadow 0.18s ease;
    }
    .cm-icon svg {
      width: 26px;
      height: 26px;
    }
    .cm-label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .cm-detail {
      margin-top: -2px;
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      background: rgba(255, 255, 255, 0.08);
    }
    .cm-item.cm-selected {
      color: #fff;
    }
    .cm-item.cm-selected .cm-icon {
      transform: scale(1.16);
      color: var(--cm-accent);
      filter: drop-shadow(0 0 10px rgba(var(--cm-accent-rgb), 0.8));
    }
    .cm-item.cm-selected .cm-label {
      text-shadow: 0 0 12px rgba(var(--cm-accent-rgb), 0.7);
    }
    .cm-item[data-disabled] {
      opacity: 0.38;
    }
    .cm-item[data-lit] .cm-icon {
      color: var(--cm-accent);
      animation: cm-lit 1.8s ease-in-out infinite;
    }
    .cm-item.cm-refuse {
      animation: cm-shake 0.32s ease;
    }
    .cm-item.cm-chosen .cm-icon {
      transform: scale(1.3);
    }
    .cm-center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 156px;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
      pointer-events: auto;
      cursor: pointer;
    }
    .cm-title {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(var(--cm-accent-rgb), 0.75);
    }
    .cm-current {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.01em;
      min-height: 20px;
    }
    .cm-current.cm-muted {
      color: var(--cm-dim);
      font-weight: 600;
      font-size: 13px;
    }
    .cm-hints {
      display: flex;
      gap: 10px;
      margin-top: 2px;
    }
    .cm-hint {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: var(--cm-dim);
      white-space: nowrap;
    }
    .cm-glyph {
      display: inline-grid;
      place-items: center;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      box-sizing: border-box;
      border-radius: 9px;
      font: 700 10px/1 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.06);
    }
    .cm-glyph.cm-confirm {
      color: #0b1220;
      border-color: transparent;
      background: var(--cm-accent);
    }
    .cm-root.cm-leaving .cm-ring {
      animation: cm-out 0.2s ease-in both;
    }
    .cm-root.cm-leaving .cm-vignette {
      animation: cm-fade 0.2s ease-in reverse both;
    }

    /* The word the controller has selected, and the strip of hints under the source. */
    .cm-word {
      position: absolute;
      box-sizing: border-box;
      border-radius: 7px;
      border: 2px solid var(--cm-accent);
      background: rgba(var(--cm-accent-rgb), 0.1);
      box-shadow:
        0 0 0 4px rgba(var(--cm-accent-rgb), 0.16),
        0 0 22px rgba(var(--cm-accent-rgb), 0.55);
      transition:
        left 0.14s cubic-bezier(0.2, 0.9, 0.3, 1),
        top 0.14s cubic-bezier(0.2, 0.9, 0.3, 1),
        width 0.14s cubic-bezier(0.2, 0.9, 0.3, 1),
        height 0.14s cubic-bezier(0.2, 0.9, 0.3, 1);
      animation: cm-word-in 0.22s cubic-bezier(0.16, 1.3, 0.3, 1) both;
    }
    /* The mouse has taken word mode over: the controller's marks wait, out of sight. */
    .cm-word.cm-word-away,
    .cm-hud.cm-hud-away {
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    .cm-word.cm-bump {
      animation: cm-bump 0.24s ease;
    }
    .cm-hud {
      position: absolute;
      bottom: 28px;
      left: 50%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 8px 14px 8px 10px;
      border-radius: 999px;
      background: rgba(14, 17, 28, 0.82);
      backdrop-filter: blur(16px) saturate(1.4);
      -webkit-backdrop-filter: blur(16px) saturate(1.4);
      box-shadow:
        0 12px 32px rgba(0, 0, 0, 0.45),
        inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      transform: translateX(-50%);
      animation: cm-hud-in 0.28s cubic-bezier(0.16, 1.2, 0.3, 1) both;
    }
    .cm-hud.cm-leaving {
      animation: cm-hud-out 0.2s ease-in both;
    }
    .cm-hud-mark {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      color: var(--cm-accent);
      background: rgba(var(--cm-accent-rgb), 0.14);
    }
    .cm-hud-mark svg {
      width: 15px;
      height: 15px;
    }
    .cm-hud-message {
      min-width: 52px;
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    @keyframes cm-in {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.72) rotate(-14deg);
        filter: blur(10px);
      }
      60% {
        opacity: 1;
        filter: blur(0);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(0);
      }
    }
    @keyframes cm-out {
      to {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.1);
        filter: blur(8px);
      }
    }
    @keyframes cm-item-in {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) translate(calc(var(--x) * 0.35), calc(var(--y) * 0.35))
          scale(0.6);
      }
    }
    @keyframes cm-fade {
      from {
        opacity: 0;
      }
    }
    @keyframes cm-spin {
      to {
        transform: rotate(360deg);
      }
    }
    @keyframes cm-lit {
      50% {
        box-shadow: 0 0 0 6px rgba(var(--cm-accent-rgb), 0.12), 0 0 18px rgba(var(--cm-accent-rgb), 0.35);
      }
    }
    @keyframes cm-flash {
      50% {
        filter: drop-shadow(0 0 26px var(--cm-accent)) brightness(1.6);
      }
    }
    @keyframes cm-shake {
      20%,
      60% {
        margin-left: -6px;
      }
      40%,
      80% {
        margin-left: 6px;
      }
    }
    @keyframes cm-word-in {
      from {
        opacity: 0;
        transform: scale(1.35);
      }
    }
    @keyframes cm-bump {
      30% {
        transform: scale(1.12);
      }
    }
    @keyframes cm-hud-in {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(14px) scale(0.96);
      }
    }
    @keyframes cm-hud-out {
      to {
        opacity: 0;
        transform: translateX(-50%) translateY(10px);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      #controller *,
      #controller *::before,
      #controller *::after {
        animation-duration: 1ms !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
  <body>
    <div id="words"></div>
    <div id="hover"></div>
    <div id="controller"></div>
    <section class="pages" hidden>
      <header>
        <strong>Original Yomitan settings &amp; dictionary import</strong
        ><button id="close">Close</button>
      </header>
      <iframe id="extension-page" title="Original Yomitan settings"></iframe>
    </section>
    <script type="module" src="overlay.js"></script>
  </body>
</html>
