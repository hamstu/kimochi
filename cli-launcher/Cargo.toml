[package]
name = "kimochi-cli"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Kimochi's command on Windows: a console program that runs the app's executable in command-line mode."

[[bin]]
name = "kimochi-cli"
path = "src/main.rs"

[dependencies]

[profile.release]
strip = true
opt-level = "s"
lto = true
panic = "abort"
