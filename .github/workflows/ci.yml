name: CI

# Native compile, lint and test gates on every OS, all on the self-hosted runners described in
# ci/runners/README.md (nothing here uses GitHub-hosted minutes). A push to main runs only these
# checks. A tag `v*` (made by `npm run release -- <x.y.z>`, scripts/cut-release.mjs) also builds
# optimised bundles per target straight into a draft release of that tag (GitHub Releases are not
# metered like workflow artifacts), which the `manifest` job publishes once every platform has
# built and signed. Tags are the only thing that builds or publishes; main stays the development
# line. There is no nightly build.
#
# OCR engines: src-tauri pins the public meikiocr and mangaocr crates to exact git revisions
# (src-tauri/Cargo.toml and Cargo.lock), so Cargo fetches the recorded source itself and the
# staging scripts read the licences and model manifest from that checkout (scripts/ocr-crates.mjs).
# The repo is checked out into `kimochi-tauri/`, which the steps below use as their directory.
#
# Runners are persistent machines: the checkout keeps the Rust target directories, node_modules
# and the staged OCR runtimes between runs instead of using the GitHub cache, so the second
# build on a machine is incremental.

on:
  # A manual run on a branch runs the checks; on a `v*` tag it re-runs that release.
  workflow_dispatch:
    inputs:
      arch_linux:
        description: On a tag, also build Linux ARM64 on the Arch runner
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['v*']
    # A push to main that only touches the website or documentation runs nothing: the app is
    # unchanged by it. Later patterns win, so CHANGELOG.md (compiled into the app's
    # "What's new") and COMMANDS.md (read by the tests) still build. GitHub does not apply path
    # filters to tag pushes, so a release always builds.
    paths:
      - '**'
      - '!site/**'
      - '!**/*.md'
      - 'CHANGELOG.md'
      - 'COMMANDS.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Prevent macOS tar from adding ._* AppleDouble files to anything we archive.
  COPYFILE_DISABLE: '1'

jobs:
  # Which machines run, and the mode: `release` for a `v*` tag (even a manual run started on one),
  # `check` for anything else, and `skip` for main's run of a release commit.
  # Only this repository has the self-hosted runners and the signing secrets: in a fork the plan
  # job is skipped, and with it every job that needs it, instead of waiting a day for a runner.
  plan:
    name: Plan
    if: github.repository == 'hamstu/kimochi'
    runs-on: [self-hosted, macOS]
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: kimochi-tauri
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      script: ${{ steps.plan.outputs.script }}
      profile: ${{ steps.plan.outputs.profile }}
      matrix: ${{ steps.plan.outputs.matrix }}
      release: ${{ steps.release.outputs.tag }}
    steps:
      # For the tag's version and its CHANGELOG.md section. Same directory and no clean as the
      # other jobs on this machine, so their kept build caches are untouched.
      - uses: actions/checkout@v4
        with:
          path: kimochi-tauri
          clean: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The release commit ("Kimochi x.y.z") reaches main in the same atomic push as its tag, so
      # the tag is already on origin when main's run starts. The tag's run checks and builds that
      # commit; main's run of it would only repeat the checks and hold the runners the release
      # needs, so it skips. Asks origin for the tag rather than trusting the push payload's file
      # lists, which an earlier guard relied on and which never skipped a run.
      - name: Detect a release commit on main
        id: tagged
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] &&
            git ls-remote --tags origin 'refs/tags/v*' | awk -v sha="$GITHUB_SHA" '$1 == sha { found = 1 } END { exit !found }'; then
            echo "::notice::$GITHUB_SHA is a release commit; its tag's run checks and builds it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/github-script@v7
        id: plan
        env:
          SKIP: ${{ steps.tagged.outputs.skip }}
          INPUT_ARCH_LINUX: ${{ inputs.arch_linux }}
        with:
          script: |
            const tag = context.ref.startsWith('refs/tags/v')
            const mode = tag ? 'release' : process.env.SKIP === 'true' ? 'skip' : 'check'
            const profile = mode === 'release' ? 'release' : 'debug'
            // The npm script per mode: `npm run release` itself cuts a release (cut-release.mjs).
            const script = mode === 'release' ? 'release:bundle' : 'bundle'
            const bundle = `kimochi-tauri/src-tauri/target/${profile}/bundle`
            const include = [
              { name: 'macOS', labels: ['self-hosted', 'macOS', 'ARM64'], target: 'aarch64-apple-darwin',
                artifacts: `${bundle}/macos/Kimochi.app.zip` },
              { name: 'Windows x64', labels: ['self-hosted', 'Windows', 'X64', 'media-pc'], target: 'x86_64-pc-windows-msvc',
                artifacts: `${bundle}/nsis/*-setup.exe` },
              { name: 'Windows ARM64', labels: ['self-hosted', 'Windows', 'ARM64'], target: 'aarch64-pc-windows-msvc',
                artifacts: `${bundle}/nsis/*-setup.exe` },
              { name: 'Linux x64', labels: ['self-hosted', 'Linux', 'X64', 'media-pc'], target: 'x86_64-unknown-linux-gnu',
                artifacts: `${bundle}/deb/*.deb\n${bundle}/appimage/*.AppImage` },
              { name: 'Linux ARM64', labels: ['self-hosted', 'Linux', 'ARM64', 'ubuntu'], target: 'aarch64-unknown-linux-gnu',
                artifacts: `${bundle}/deb/*.deb\n${bundle}/appimage/*.AppImage` },
            ]
            if (process.env.INPUT_ARCH_LINUX === 'true') include.push(
              { name: 'Linux ARM64 (Arch)', labels: ['self-hosted', 'Linux', 'ARM64', 'arch'], target: 'aarch64-unknown-linux-gnu',
                artifacts: `${bundle}/deb/*.deb\n${bundle}/appimage/*.AppImage`, suffix: '-arch' })
            core.setOutput('mode', mode)
            core.setOutput('script', script)
            core.setOutput('profile', profile)
            core.setOutput('matrix', JSON.stringify({ include }))
            core.summary.addHeading(`Mode: ${mode}`).addList(include.map((p) => `${p.name} → ${p.labels.join(', ')}`)).write()

      # The release the bundle jobs upload into. A tag gets a draft release of its own, with its
      # CHANGELOG.md section as the notes (which also become latest.json's notes, the app's
      # "What's new"); the `manifest` job publishes it once every platform has built and signed.
      # The tag must be `v` plus tauri.conf.json's version, checked here before anything builds
      # (the manifest job would refuse it after an hour of bundling otherwise).
      - name: Prepare release
        id: release
        if: steps.plan.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [[ "$tag" != "v$version" ]]; then
            echo "::error::Tag $tag does not match version $version in src-tauri/tauri.conf.json (expected v$version). Cut releases with \`npm run release -- <x.y.z>\`, which sets both."
            exit 1
          fi
          # Fails (with the reason) when CHANGELOG.md has no entries for this version.
          node scripts/changelog.mjs section "$version" > ../release-notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file ../release-notes.md >/dev/null
          else
            gh release create "$tag" --draft --verify-tag --title "Kimochi $tag" --notes-file ../release-notes.md
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.labels }}
    defaults:
      run:
        shell: bash
        working-directory: kimochi-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          path: kimochi-tauri
          clean: false
      # Drop stale build output but keep the expensive, regenerable caches, wiping those weekly
      # or when they outgrow the machine (ci/runners/prune-build-cache.sh).
      - name: Clean workspace
        run: |
          git clean -ffdx -e src-tauri/target -e capture-core/target -e speech-core/target -e oneocr-worker/target -e screenai/target -e node_modules -e src-tauri/resources -e extensions
          bash ci/runners/prune-build-cache.sh

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          # Arch runners get their packages from ci/runners/setup-runner.sh --deps.
          command -v apt-get >/dev/null || { echo "no apt-get; assuming prerequisites are installed"; exit 0; }
          sudo apt-get update
          # pipewire-bin: /usr/share/pipewire/client.conf, which scripts/linux-appimage.mjs
          # copies into the AppImage with the modules it names.
          # libavif-dev: the app links libavif to decode dictionary AVIF images (Jitendex), which
          # WebKitGTK cannot; the AppImage bundles it with its AV1 decoder.
          # libgtk-layer-shell0: the AppImage bundles it so native Wayland overlays (Hyprland,
          # Sway, KDE) work without the user installing it.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libpipewire-0.3-dev \
            pipewire-bin \
            libspa-0.2-dev \
            libclang-dev \
            libudev-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-pulseaudio \
            libavif-dev \
            libgtk-layer-shell0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # The engine trees (Yomitan, Hachidori, 10ten) are gitignored; the tests and the harness read
      # the pinned releases from the kept extensions/ cache. A no-op when they already match
      # extensions/<id>.sha256.json. (The app downloads them on demand; bundles carry none.)
      - name: Fetch vendored extensions
        run: node scripts/sync-extension.mjs --all --if-missing
      # `npm ci` runs the `prepare` lifecycle script (scripts/prepare.mjs), which builds dist/.
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      # cargo clippy -D warnings for src-tauri. Creates the OCR resource paths tauri.conf.json
      # names (an empty runtime directory, the licences) so tauri-build's resource copy succeeds
      # without downloading anything.
      - run: npm run check:rust
      - name: Test capture-core
        # Swift-backed crates link @rpath/libswift_*.dylib from the OS. The variable is set on the
        # command line because SIP strips DYLD_* from /bin/bash's own environment.
        run: ${{ runner.os == 'macOS' && 'DYLD_LIBRARY_PATH=/usr/lib/swift ' || '' }}cargo test --manifest-path capture-core/Cargo.toml
      - name: Test speech-core
        # Sentence audio's listener, matcher and clips (the tests that need the ONNX Runtime and a
        # model are opt-in). Links capture-core, so the same Swift note applies.
        run: ${{ runner.os == 'macOS' && 'DYLD_LIBRARY_PATH=/usr/lib/swift ' || '' }}cargo test --manifest-path speech-core/Cargo.toml
      - name: Test the Screen AI worker crate
        # Its pipe protocol, result decoding and component search; Google's library is not needed.
        run: cargo test --manifest-path screenai/Cargo.toml

  bundle:
    name: Bundle (${{ matrix.name }})
    needs: [plan, checks]
    permissions:
      contents: write
    # Only a tag bundles, and only once every platform's checks passed.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.mode == 'release' && needs.checks.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.labels }}
    defaults:
      run:
        shell: bash
        working-directory: kimochi-tauri
    env:
      KIMOCHI_TARGET: ${{ matrix.target }}
      # macOS: without the Apple secrets, ad-hoc sign the app and the bundled dylib rather than
      # picking up whatever identity the runner's keychain holds.
      KIMOCHI_ADHOC: ${{ secrets.APPLE_CERTIFICATE == '' && '1' || '' }}
      # Step-level env is not visible to a step's own `if`, so expose the gates at job level.
      HAS_WINDOWS_SIGNING: ${{ secrets.AZURE_TENANT_ID != '' }}
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: kimochi-tauri
          clean: false
      - name: Clean workspace
        run: |
          git clean -ffdx -e src-tauri/target -e capture-core/target -e speech-core/target -e oneocr-worker/target -e screenai/target -e node_modules -e src-tauri/resources -e extensions
          # Only this run's bundles (and updater artifacts) may be uploaded.
          rm -rf src-tauri/target/${{ needs.plan.outputs.profile }}/bundle ../updater
          bash ci/runners/prune-build-cache.sh

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          command -v apt-get >/dev/null || { echo "no apt-get; assuming prerequisites are installed"; exit 0; }
          sudo apt-get update
          # pipewire-bin: /usr/share/pipewire/client.conf, which scripts/linux-appimage.mjs
          # copies into the AppImage with the modules it names.
          # libavif-dev: the app links libavif to decode dictionary AVIF images (Jitendex), which
          # WebKitGTK cannot; the AppImage bundles it with its AV1 decoder.
          # libgtk-layer-shell0: the AppImage bundles it so native Wayland overlays (Hyprland,
          # Sway, KDE) work without the user installing it.
          # xdg-utils: tauri's AppImage step runs xdg-mime, which a minimal Ubuntu (WSL) lacks.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libpipewire-0.3-dev \
            pipewire-bin \
            libspa-0.2-dev \
            libclang-dev \
            libudev-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-pulseaudio \
            libavif-dev \
            libgtk-layer-shell0 \
            xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable

      # Every Linux build links libavif for dictionary images (Jitendex) and bundles GTK
      # layer-shell for Wayland overlays: fail in seconds, naming the package, rather than at the
      # end of the bundle. Arch runners install their own packages.
      - name: Check bundled Linux libraries
        if: runner.os == 'Linux'
        run: node scripts/linux-appimage.mjs --check-deps

      - name: Install OneOCR and text hook helper Rust targets
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc i686-pc-windows-msvc

      # Linux x64 ships the text hook helper too (Windows games under Proton/Wine), cross-built
      # with MinGW (scripts/prepare-hookd.mjs).
      - name: Install text hook helper Rust targets and MinGW
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          rustup target add x86_64-pc-windows-gnu i686-pc-windows-gnu
          if command -v apt-get >/dev/null; then
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y gcc-mingw-w64-x86-64 gcc-mingw-w64-i686
          elif command -v pacman >/dev/null; then
            command -v x86_64-w64-mingw32-gcc >/dev/null || sudo pacman -S --needed --noconfirm mingw-w64-gcc
          fi

      - name: Ensure ARM64 C++ tools for OneOCR helper
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installed = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (-not $installed) {
            $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $vs) { throw 'MSVC C++ tools not found' }
            $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
            $process = Start-Process $setup -ArgumentList @('modify', '--installPath', ('"' + $vs + '"'), '--add', 'Microsoft.VisualStudio.Component.VC.Tools.ARM64', '--quiet', '--norestart') -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) { throw "ARM64 C++ tools installation failed: $($process.ExitCode)" }
          }

      - name: Install Windows signing CLI
        if: runner.os == 'Windows' && env.HAS_WINDOWS_SIGNING == 'true'
        run: cargo install --locked artifact-signing-cli

      # makensis maps the whole installer in the temp directory; the system drive of a runner can
      # be nearly full while its work drive has plenty, so use the runner's own temp directory.
      - name: Use the runner's work drive for temporary files
        if: runner.os == 'Windows'
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      # macOS signing and notarisation are tauri's own: given APPLE_SIGNING_IDENTITY it signs the
      # .app with the hardened runtime, and given the App Store Connect API key (issuer, key id and
      # the .p8 file) it notarises the .app and staples the ticket, failing the build when Apple
      # rejects it. The Developer ID certificate (APPLE_CERTIFICATE, a base64 .p12) goes into a
      # keychain of this job's own: the runner's launchd job runs in a security session of its own
      # (SessionCreate), where the login keychain is locked, and scripts/run.mjs signs the bundled
      # dylib before tauri runs, so tauri's own import would come too late.
      - name: Apple signing keychain and notarisation key
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          for name in APPLE_SIGNING_IDENTITY APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_CONTENT; do
            [[ -n "${!name}" ]] || { echo "APPLE_CERTIFICATE is set but $name is not" >&2; exit 1; }
          done
          umask 077
          keychain="$RUNNER_TEMP/kimochi-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          rm -f "$keychain"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          # Searched first, for this job only; the cleanup step below restores the list.
          security list-keychains -d user > "$RUNNER_TEMP/keychains-before"
          security list-keychains -d user -s "$keychain" $(sed 's/"//g' "$RUNNER_TEMP/keychains-before")
          security find-identity -v -p codesigning "$keychain"
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/apple-api-key.p8"
          # Not APPLE_CERTIFICATE: the identity is already in the job's keychain.
          {
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-api-key.p8"
            for name in APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY; do
              printf '%s<<__APPLE__\n%s\n__APPLE__\n' "$name" "${!name}"
            done
          } >> "$GITHUB_ENV"

      # No engine tree is needed here: bundles carry none (the app downloads them on demand), and
      # scripts/prepare.mjs checks that dist/ holds none.
      - run: npm ci
      - name: Bundle (${{ needs.plan.outputs.mode }})
        run: npm run ${{ needs.plan.outputs.script }}
        env:
          # Windows: scripts/sign-windows.mjs (signCommand) signs when these are present and
          # skips with a warning otherwise. KIMOCHI_REQUIRE_SIGNING makes a partial secret set
          # an error rather than a silently unsigned installer.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          KIMOCHI_SIGNING_ENDPOINT: ${{ vars.KIMOCHI_SIGNING_ENDPOINT }}
          KIMOCHI_SIGNING_ACCOUNT: ${{ vars.KIMOCHI_SIGNING_ACCOUNT }}
          KIMOCHI_SIGNING_PROFILE: ${{ vars.KIMOCHI_SIGNING_PROFILE }}
          KIMOCHI_REQUIRE_SIGNING: ${{ secrets.AZURE_TENANT_ID != '' && '1' || '' }}

      - name: Verify macOS signature and notarisation
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        run: |
          app=src-tauri/target/${{ needs.plan.outputs.profile }}/bundle/macos/Kimochi.app
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Remove the signing keychain and notarisation key
        if: always() && runner.os == 'macOS'
        run: |
          rm -f "$RUNNER_TEMP/apple-api-key.p8" "$RUNNER_TEMP/certificate.p12"
          if [[ -f "$RUNNER_TEMP/keychains-before" ]]; then
            security list-keychains -d user -s $(sed 's/"//g' "$RUNNER_TEMP/keychains-before")
            rm -f "$RUNNER_TEMP/keychains-before"
          fi
          security delete-keychain "$RUNNER_TEMP/kimochi-signing.keychain-db" 2>/dev/null || true

      - name: Verify Windows signature
        if: runner.os == 'Windows' && env.HAS_WINDOWS_SIGNING == 'true'
        shell: powershell
        run: |
          Get-ChildItem src-tauri/target/${{ needs.plan.outputs.profile }}/bundle/nsis/*-setup.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { exit 1 }
          }

      # Release mode: what the app's self-updater downloads for this platform (macOS: a tar.gz of
      # the .app; Windows: the installer; Linux: the AppImage and the .deb), each one's minisign
      # signature, and a sidecar for the manifest job below. Runs after every step that touches
      # the bundles (the AppImage repack inside `npm run release:bundle`, Authenticode signing),
      # so the signature covers the bytes users download. The key is the TAURI_SIGNING_PRIVATE_KEY
      # secret (`tauri signer generate`); its public half is `plugins.updater.pubkey` in
      # tauri.conf.json. A release without it cannot be updated to, so the step fails rather
      # than skips.
      - name: Updater artifacts
        if: needs.plan.outputs.mode == 'release'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/updater-artifacts.mjs sign --target "$KIMOCHI_TARGET" --profile ${{ needs.plan.outputs.profile }} --out ../updater

      # A zip keeps the .app's file modes and signature intact.
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent src-tauri/target/${{ needs.plan.outputs.profile }}/bundle/macos/Kimochi.app src-tauri/target/${{ needs.plan.outputs.profile }}/bundle/macos/Kimochi.app.zip

      # Releases keep tauri's versioned file names.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE: ${{ needs.plan.outputs.release }}
          SUFFIX: ${{ matrix.suffix }}
          PATTERNS: ${{ matrix.artifacts }}
        run: |
          set -euo pipefail
          rm -rf ../upload && mkdir ../upload
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          found=0
          while IFS= read -r pattern; do
            [[ -z "$pattern" ]] && continue
            for file in ${pattern#kimochi-tauri/}; do
              [[ -f "$file" ]] || continue
              found=1
              name="$(basename "$file")"
              case "$name" in
                Kimochi.app.zip) name="Kimochi_${version}_aarch64.app.zip" ;;
              esac
              if [[ -n "$SUFFIX" ]]; then
                name="${name%.*}${SUFFIX}.${name##*.}"
              fi
              cp "$file" "../upload/$name"
            done
          done <<< "$PATTERNS"
          [[ $found == 1 ]] || { echo "no bundle matched: $PATTERNS" >&2; exit 1; }
          # The updater's signatures, sidecars and the macOS tar.gz, named as the manifest will
          # name them.
          if [[ -d ../updater ]]; then cp ../updater/* ../upload/; fi
          ls -l ../upload
          gh release upload "$RELEASE" ../upload/* --clobber

  # A tag's release: `latest.json`, the document the app's updater fetches
  # (`https://github.com/<repo>/releases/latest/download/latest.json`), composed from the
  # sidecars every bundle job uploaded, and then the release published. It needs every bundle
  # job to succeed (and in release mode a bundle runs only when every platform's checks passed),
  # so a release is published only when all platforms were checked, built and signed: a manifest
  # missing a platform would tell that platform there is no update, for good. If anything
  # fails, nothing is published and the release stays a draft: re-run the failed jobs for a
  # flaky machine, or delete the draft and the tag and cut a new version for a code fix.
  # GitHub resolves `latest` only once the draft is published, so publishing offers the update.
  manifest:
    name: Update manifest and publish
    needs: [plan, bundle]
    if: needs.plan.outputs.mode == 'release'
    runs-on: [self-hosted, macOS]
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: kimochi-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          path: kimochi-tauri
          clean: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The script uses node built-ins only: no `npm ci` (which would rebuild dist/ here).
      - name: Compose and upload latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE: ${{ needs.plan.outputs.release }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          rm -rf ../manifest && mkdir ../manifest
          gh release download "$RELEASE" --pattern 'updater-*.json' --dir ../manifest
          gh release view "$RELEASE" --json body --jq .body > ../manifest/notes.md
          date="$(gh release view "$RELEASE" --json createdAt --jq .createdAt)"
          node scripts/updater-artifacts.mjs manifest \
            --version "$version" --tag "$RELEASE" --repo "$GH_REPO" \
            --sidecars ../manifest --notes ../manifest/notes.md --date "$date" \
            --out ../manifest/latest.json
          cat ../manifest/latest.json
          gh release upload "$RELEASE" ../manifest/latest.json --clobber
          # The sidecars have served their purpose.
          for sidecar in ../manifest/updater-*.json; do
            gh release delete-asset "$RELEASE" "$(basename "$sidecar")" --yes
          done
      # Last: from here installed apps are offered the update.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE: ${{ needs.plan.outputs.release }}
        run: |
          gh release edit "$RELEASE" --draft=false --latest
          echo "Published $GITHUB_SERVER_URL/$GH_REPO/releases/tag/$RELEASE" >> "$GITHUB_STEP_SUMMARY"

  # GITHUB_TOKEN publication does not trigger release-event workflows.
  announce:
    name: Announce release on Discord
    needs: [plan, manifest]
    if: needs.plan.outputs.mode == 'release'
    uses: ./.github/workflows/discord-release.yml
    with:
      tag: ${{ needs.plan.outputs.release }}
    secrets:
      DISCORD_RELEASES_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
