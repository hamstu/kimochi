name: CI

# Native compile, lint and test gates on every OS, then a bundle of the app per target, all on
# the self-hosted runners described in ci/runners/README.md (nothing here uses GitHub-hosted
# minutes). Bundles go straight to GitHub Releases, which are not metered like workflow
# artifacts: a push to main replaces the assets of the rolling `nightly` pre-release, and a tag
# `v*` builds optimised bundles into a draft release of that tag for a final look.
#
# Sibling repositories: src-tauri depends on `../../kimochi-meikiocr` and `../../kimochi-mangaocr`
# by path, and the OCR staging scripts read their LICENSE/NOTICE and model manifest. This repo is
# therefore checked out into `kimochi-tauri/` with the siblings beside it. The siblings are private
# repositories under the same owner, read through the MEIKIOCR_DEPLOY_KEY / MANGAOCR_DEPLOY_KEY
# secrets (read-only deploy keys). SIBLING_REPOS_TOKEN (a fine-grained PAT with Contents: read on
# both) still works as an alternative. Override KIMOCHI_MEIKIOCR_REPO / KIMOCHI_MANGAOCR_REPO if
# they move.
#
# Runners are persistent machines: the checkout keeps the Rust target directories, node_modules
# and the staged OCR runtimes between runs instead of using the GitHub cache, so the second
# build on a machine is incremental.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build mode
        type: choice
        options: [bundle, release]
        default: bundle
      arch_linux:
        description: Also build Linux ARM64 on the Arch runner
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Prevent macOS tar from adding ._* AppleDouble files to anything we archive.
  COPYFILE_DISABLE: '1'

jobs:
  # Which machines build, and whether optimised or debug. A tag always releases; a manual run
  # chooses; a push to main bundles.
  plan:
    name: Plan
    runs-on: [self-hosted, macOS]
    permissions:
      contents: write
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      profile: ${{ steps.plan.outputs.profile }}
      matrix: ${{ steps.plan.outputs.matrix }}
      release: ${{ steps.release.outputs.tag }}
      rolling: ${{ steps.release.outputs.rolling }}
    steps:
      - uses: actions/github-script@v7
        id: plan
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_ARCH_LINUX: ${{ inputs.arch_linux }}
        with:
          script: |
            const tag = context.ref.startsWith('refs/tags/')
            const mode = process.env.INPUT_MODE || (tag ? 'release' : 'bundle')
            const profile = mode === 'release' ? 'release' : 'debug'
            const bundle = `kimochi-tauri/src-tauri/target/${profile}/bundle`
            const include = [
              { name: 'macOS', labels: ['self-hosted', 'macOS', 'ARM64'], target: 'aarch64-apple-darwin',
                artifacts: `${bundle}/macos/Kimochi.app.zip` },
              { name: 'Windows x64', labels: ['self-hosted', 'Windows', 'X64'], target: 'x86_64-pc-windows-msvc',
                artifacts: `${bundle}/nsis/*-setup.exe` },
              { name: 'Windows ARM64', labels: ['self-hosted', 'Windows', 'ARM64'], target: 'aarch64-pc-windows-msvc',
                artifacts: `${bundle}/nsis/*-setup.exe` },
              { name: 'Linux x64', labels: ['self-hosted', 'Linux', 'X64'], target: 'x86_64-unknown-linux-gnu',
                artifacts: `${bundle}/deb/*.deb\n${bundle}/appimage/*.AppImage` },
              { name: 'Linux ARM64', labels: ['self-hosted', 'Linux', 'ARM64', 'ubuntu'], target: 'aarch64-unknown-linux-gnu',
                artifacts: `${bundle}/deb/*.deb\n${bundle}/appimage/*.AppImage` },
            ]
            if (process.env.INPUT_ARCH_LINUX === 'true') include.push(
              { name: 'Linux ARM64 (Arch)', labels: ['self-hosted', 'Linux', 'ARM64', 'arch'], target: 'aarch64-unknown-linux-gnu',
                artifacts: `${bundle}/deb/*.deb\n${bundle}/appimage/*.AppImage`, suffix: '-arch' })
            core.setOutput('mode', mode)
            core.setOutput('profile', profile)
            core.setOutput('matrix', JSON.stringify({ include }))
            core.summary.addHeading(`Mode: ${mode}`).addList(include.map((p) => `${p.name} → ${p.labels.join(', ')}`)).write()

      # The release the bundle jobs upload into. A tag gets a draft release of its own (publish
      # it by hand once the bundles look right). Anything else refreshes the rolling `nightly`
      # pre-release: its tag is moved to this commit and each bundle job replaces its own
      # assets, so only one set of development bundles is ever stored.
      - name: Prepare release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            gh release view "$tag" >/dev/null 2>&1 ||
              gh release create "$tag" --draft --title "Kimochi $tag" --generate-notes
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "rolling=false" >> "$GITHUB_OUTPUT"
          else
            tag=nightly
            if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
              gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            else
              gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
            fi
            notes="Development build of \`$GITHUB_REF_NAME\` at ${GITHUB_SHA:0:7} (run [#$GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID)). Replaced on every push; unsigned debug bundles."
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --prerelease --title "Latest development build" --notes "$notes" >/dev/null
            else
              gh release create "$tag" --prerelease --title "Latest development build" --notes "$notes"
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "rolling=true" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Checks (${{ matrix.name }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.labels }}
    defaults:
      run:
        shell: bash
        working-directory: kimochi-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          path: kimochi-tauri
          clean: false
      - name: Check out kimochi-meikiocr
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.KIMOCHI_MEIKIOCR_REPO || format('{0}/kimochi-meikiocr', github.repository_owner) }}
          ssh-key: ${{ secrets.MEIKIOCR_DEPLOY_KEY }}
          token: ${{ secrets.SIBLING_REPOS_TOKEN || github.token }}
          path: kimochi-meikiocr
      - name: Check out kimochi-mangaocr
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.KIMOCHI_MANGAOCR_REPO || format('{0}/kimochi-mangaocr', github.repository_owner) }}
          ssh-key: ${{ secrets.MANGAOCR_DEPLOY_KEY }}
          token: ${{ secrets.SIBLING_REPOS_TOKEN || github.token }}
          path: kimochi-mangaocr
      # Drop stale build output but keep the expensive, regenerable caches.
      - name: Clean workspace
        run: git clean -ffdx -e src-tauri/target -e capture-core/target -e oneocr-worker/target -e node_modules -e src-tauri/resources -e extensions

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          # Arch runners get their packages from ci/runners/setup-runner.sh --deps.
          command -v apt-get >/dev/null || { echo "no apt-get; assuming prerequisites are installed"; exit 0; }
          sudo apt-get update
          # pipewire-bin: /usr/share/pipewire/client.conf, which scripts/linux-appimage.mjs
          # copies into the AppImage with the modules it names.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libpipewire-0.3-dev \
            pipewire-bin \
            libspa-0.2-dev \
            libclang-dev \
            libudev-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-pulseaudio

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # The Hachidori and 10ten trees are gitignored; fetch the pinned releases into the kept
      # extensions/ cache (a no-op when they already match extensions/<id>.sha256.json).
      - name: Fetch vendored extensions
        run: node scripts/sync-extension.mjs --all --if-missing
      # `npm ci` runs the `prepare` lifecycle script (scripts/prepare.mjs), which builds dist/.
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      # cargo clippy -D warnings for src-tauri. Creates the OCR resource paths tauri.conf.json
      # names (an empty runtime directory, the licences) so tauri-build's resource copy succeeds
      # without downloading anything.
      - run: npm run check:rust
      - name: Test capture-core
        # Swift-backed crates link @rpath/libswift_*.dylib from the OS. The variable is set on the
        # command line because SIP strips DYLD_* from /bin/bash's own environment.
        run: ${{ runner.os == 'macOS' && 'DYLD_LIBRARY_PATH=/usr/lib/swift ' || '' }}cargo test --manifest-path capture-core/Cargo.toml

  bundle:
    name: Bundle (${{ matrix.name }})
    needs: [plan, checks]
    permissions:
      contents: write
    # Bundles follow the checks but do not wait on other platforms' results: one machine's red
    # check must not withhold every other platform's build. A release still needs them all green.
    if: always() && needs.plan.result == 'success' && (needs.checks.result == 'success' || needs.plan.outputs.mode != 'release')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.labels }}
    defaults:
      run:
        shell: bash
        working-directory: kimochi-tauri
    env:
      KIMOCHI_TARGET: ${{ matrix.target }}
      # macOS: ad-hoc sign the app and the bundled dylib (no Developer ID / notarisation yet).
      KIMOCHI_ADHOC: '1'
      # Step-level env is not visible to a step's own `if`, so expose the gate at job level.
      HAS_WINDOWS_SIGNING: ${{ secrets.AZURE_TENANT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: kimochi-tauri
          clean: false
      - name: Check out kimochi-meikiocr
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.KIMOCHI_MEIKIOCR_REPO || format('{0}/kimochi-meikiocr', github.repository_owner) }}
          ssh-key: ${{ secrets.MEIKIOCR_DEPLOY_KEY }}
          token: ${{ secrets.SIBLING_REPOS_TOKEN || github.token }}
          path: kimochi-meikiocr
      - name: Check out kimochi-mangaocr
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.KIMOCHI_MANGAOCR_REPO || format('{0}/kimochi-mangaocr', github.repository_owner) }}
          ssh-key: ${{ secrets.MANGAOCR_DEPLOY_KEY }}
          token: ${{ secrets.SIBLING_REPOS_TOKEN || github.token }}
          path: kimochi-mangaocr
      - name: Clean workspace
        run: |
          git clean -ffdx -e src-tauri/target -e capture-core/target -e oneocr-worker/target -e node_modules -e src-tauri/resources -e extensions
          # Only this run's bundles may be uploaded.
          rm -rf src-tauri/target/${{ needs.plan.outputs.profile }}/bundle

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          command -v apt-get >/dev/null || { echo "no apt-get; assuming prerequisites are installed"; exit 0; }
          sudo apt-get update
          # pipewire-bin: /usr/share/pipewire/client.conf, which scripts/linux-appimage.mjs
          # copies into the AppImage with the modules it names.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libpipewire-0.3-dev \
            pipewire-bin \
            libspa-0.2-dev \
            libclang-dev \
            libudev-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-pulseaudio

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable

      - name: Install OneOCR helper Rust targets
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc

      - name: Ensure ARM64 C++ tools for OneOCR helper
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installed = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (-not $installed) {
            $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $vs) { throw 'MSVC C++ tools not found' }
            $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
            $process = Start-Process $setup -ArgumentList @('modify', '--installPath', ('"' + $vs + '"'), '--add', 'Microsoft.VisualStudio.Component.VC.Tools.ARM64', '--quiet', '--norestart') -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) { throw "ARM64 C++ tools installation failed: $($process.ExitCode)" }
          }

      - name: Install Windows signing CLI
        if: runner.os == 'Windows' && env.HAS_WINDOWS_SIGNING == 'true'
        run: cargo install --locked artifact-signing-cli

      # The Hachidori and 10ten trees are gitignored; fetch the pinned releases into the kept
      # extensions/ cache (a no-op when they already match extensions/<id>.sha256.json).
      - name: Fetch vendored extensions
        run: node scripts/sync-extension.mjs --all --if-missing
      - run: npm ci
      - name: Bundle (${{ needs.plan.outputs.mode }})
        run: npm run ${{ needs.plan.outputs.mode }}
        env:
          # Windows: scripts/sign-windows.mjs (signCommand) signs when these are present and
          # skips with a warning otherwise. KIMOCHI_REQUIRE_SIGNING makes a partial secret set
          # an error rather than a silently unsigned installer.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          KIMOCHI_SIGNING_ENDPOINT: ${{ vars.KIMOCHI_SIGNING_ENDPOINT }}
          KIMOCHI_SIGNING_ACCOUNT: ${{ vars.KIMOCHI_SIGNING_ACCOUNT }}
          KIMOCHI_SIGNING_PROFILE: ${{ vars.KIMOCHI_SIGNING_PROFILE }}
          KIMOCHI_REQUIRE_SIGNING: ${{ secrets.AZURE_TENANT_ID != '' && '1' || '' }}

      - name: Verify Windows signature
        if: runner.os == 'Windows' && env.HAS_WINDOWS_SIGNING == 'true'
        shell: powershell
        run: |
          Get-ChildItem src-tauri/target/${{ needs.plan.outputs.profile }}/bundle/nsis/*-setup.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { exit 1 }
          }

      # A zip keeps the .app's file modes and signature intact.
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent src-tauri/target/${{ needs.plan.outputs.profile }}/bundle/macos/Kimochi.app src-tauri/target/${{ needs.plan.outputs.profile }}/bundle/macos/Kimochi.app.zip

      # Tag releases keep tauri's versioned file names. The rolling nightly drops the version
      # from the name so each push replaces the previous asset instead of piling up beside it.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE: ${{ needs.plan.outputs.release }}
          ROLLING: ${{ needs.plan.outputs.rolling }}
          SUFFIX: ${{ matrix.suffix }}
          PATTERNS: ${{ matrix.artifacts }}
        run: |
          set -euo pipefail
          rm -rf ../upload && mkdir ../upload
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          found=0
          while IFS= read -r pattern; do
            [[ -z "$pattern" ]] && continue
            for file in ${pattern#kimochi-tauri/}; do
              [[ -f "$file" ]] || continue
              found=1
              name="$(basename "$file")"
              case "$name" in
                Kimochi.app.zip) name="Kimochi_${version}_aarch64.app.zip" ;;
              esac
              if [[ "$ROLLING" == true ]]; then
                name="$(printf '%s' "$name" | sed -E 's/_[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.]+)?_/_/')"
              fi
              if [[ -n "$SUFFIX" ]]; then
                name="${name%.*}${SUFFIX}.${name##*.}"
              fi
              cp "$file" "../upload/$name"
            done
          done <<< "$PATTERNS"
          [[ $found == 1 ]] || { echo "no bundle matched: $PATTERNS" >&2; exit 1; }
          ls -l ../upload
          gh release upload "$RELEASE" ../upload/* --clobber
