name: CI

# Everything runs on GitHub's own runners (free and unmetered for a public repository).
#
# - A pull request runs `Lint` (formatting, oxlint, typecheck) and `Checks` (the tests and the
#   Rust lints and tests) on macOS, Windows x64 and Linux x64. A pull request that changes only
#   the website or Markdown runs `Lint` alone. `CI` sums the run up: it is the one status the
#   `main` ruleset requires, so a pull request set to auto-merge merges once it is green.
# - A push to `main` runs the same, and the checks on all five platforms (adding Linux and
#   Windows ARM64). It also refreshes the caches pull requests start from.
# - A `v*` tag (made by `npm run release -- <x.y.z>`, scripts/cut-release.mjs) runs the checks on
#   every platform, then builds, signs and uploads an optimised bundle per platform into a draft
#   release, which the `manifest` job publishes once every platform has succeeded. Only a tag
#   builds bundles or publishes.
#
# Caches (all saved from `main` only, so pull requests read them without crowding them out):
# node_modules per OS and lockfile, the engine downloads (extensions/), and each platform's Rust
# dependencies, which every check crate shares through one target directory. Release bundles
# start their Rust build cold: a tag can read main's caches, but main never builds the optimised
# profile.

on:
  pull_request:
  # A manual run on a branch runs the checks on every platform (and, with `bundles`, builds the
  # optimised, signed bundles a release would, kept as workflow artifacts: nothing is published);
  # on a `v*` tag it re-runs that release.
  workflow_dispatch:
    inputs:
      bundles:
        description: Also build release bundles (a trial; kept as workflow artifacts)
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['v*']
    # A push to main that only touches the website or documentation runs nothing: the app is
    # unchanged by it. Later patterns win, so CHANGELOG.md (compiled into the app's "What's
    # new") and COMMANDS.md (read by the tests) still run. GitHub does not apply path filters to
    # tag pushes, so a release always builds.
    paths:
      - '**'
      - '!site/**'
      - '!**/*.md'
      - 'CHANGELOG.md'
      - 'COMMANDS.md'

# A new push to a pull request replaces its unfinished run. On main a run always finishes (it
# saves the caches pull requests start from; cancelled ones would leave the slowest platforms
# cold), and of the pushes that arrive meanwhile only the newest waits to run. A release is
# never cut short.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Prevent macOS tar from adding ._* AppleDouble files to anything we archive.
  COPYFILE_DISABLE: '1'
  NODE_VERSION: 22

jobs:
  # What this run does: `release` for a `v*` tag (even a manual run started on one), `skip` for
  # main's run of a release commit (its tag's run checks it), `check` otherwise; whether the app
  # changed (a pull request touching only the website or Markdown runs Lint alone); and which
  # platforms check.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      app: ${{ steps.plan.outputs.app }}
      profile: ${{ steps.plan.outputs.profile }}
      script: ${{ steps.plan.outputs.script }}
      checks: ${{ steps.plan.outputs.checks }}
      bundles: ${{ steps.plan.outputs.bundles }}
      release: ${{ steps.release.outputs.tag }}
    steps:
      # For the tag's version and its CHANGELOG.md section.
      - uses: actions/checkout@v4
      # The release commit ("Kimochi x.y.z") reaches main in the same atomic push as its tag, so
      # the tag is already on origin when main's run starts. The tag's run checks and builds that
      # commit; main's run of it would only repeat the checks, so it skips.
      - name: Detect a release commit on main
        id: tagged
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] &&
            git ls-remote --tags origin 'refs/tags/v*' | awk -v sha="$GITHUB_SHA" '$1 == sha { found = 1 } END { exit !found }'; then
            echo "::notice::$GITHUB_SHA is a release commit; its tag's run checks and builds it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/github-script@v7
        id: plan
        env:
          SKIP: ${{ steps.tagged.outputs.skip }}
          TRIAL: ${{ inputs.bundles }}
        with:
          script: |
            const tag = context.ref.startsWith('refs/tags/v')
            const pr = context.eventName === 'pull_request'
            // `trial`: a manual run's release build, with nothing uploaded to a release.
            const mode = tag ? 'release' : process.env.SKIP === 'true' ? 'skip' : process.env.TRIAL === 'true' ? 'trial' : 'check'
            const profile = mode === 'release' || mode === 'trial' ? 'release' : 'debug'

            // A pull request that changes only the website or Markdown leaves the app as it was
            // (the same rule as the push filter above).
            let app = true
            if (pr) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100
              })
              const docs = (name) =>
                name.startsWith('site/') || (name.endsWith('.md') && !['CHANGELOG.md', 'COMMANDS.md'].includes(name))
              app = files.some((file) => !docs(file.filename) || (file.previous_filename && !docs(file.previous_filename)))
            }

            const bundle = `src-tauri/target/${profile}/bundle`
            const platforms = [
              { name: 'macOS', runner: 'macos-latest', target: 'aarch64-apple-darwin',
                artifacts: `${bundle}/macos/Kimochi.app.zip`, pr: true },
              { name: 'Windows x64', runner: 'windows-2025', target: 'x86_64-pc-windows-msvc',
                artifacts: `${bundle}/nsis/*-setup.exe`, pr: true },
              { name: 'Linux x64', runner: 'ubuntu-24.04', target: 'x86_64-unknown-linux-gnu',
                artifacts: `${bundle}/deb/*.deb\n${bundle}/appimage/*.AppImage`, pr: true },
              { name: 'Windows ARM64', runner: 'windows-11-arm', target: 'aarch64-pc-windows-msvc',
                artifacts: `${bundle}/nsis/*-setup.exe` },
              { name: 'Linux ARM64', runner: 'ubuntu-24.04-arm', target: 'aarch64-unknown-linux-gnu',
                artifacts: `${bundle}/deb/*.deb\n${bundle}/appimage/*.AppImage` },
            ]
            // Pull requests check the three primary platforms; main, manual runs and releases
            // check all five (the ARM64 builds differ little, and main catches what slips by).
            const checks = platforms.filter((p) => !pr || p.pr)
            core.setOutput('mode', mode)
            core.setOutput('app', String(app))
            core.setOutput('profile', profile)
            // The npm script per mode: `npm run release` itself cuts a release (cut-release.mjs).
            core.setOutput('script', profile === 'release' ? 'release:bundle' : 'bundle')
            core.setOutput('checks', JSON.stringify({ include: checks }))
            core.setOutput('bundles', JSON.stringify({ include: platforms }))
            await core.summary
              .addHeading(`Mode: ${mode}${app ? '' : ' (website and docs only: lint only)'}`, 3)
              .addList(checks.map((p) => `${p.name} → ${p.runner}`))
              .write()

      # The release the bundle jobs upload into. A tag gets a draft release of its own, with its
      # CHANGELOG.md section as the notes (which also become latest.json's notes, the app's
      # "What's new"); the `manifest` job publishes it once every platform has built and signed.
      # The tag must be `v` plus tauri.conf.json's version, checked here before anything builds.
      - name: Prepare release
        id: release
        if: steps.plan.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [[ "$tag" != "v$version" ]]; then
            echo "::error::Tag $tag does not match version $version in src-tauri/tauri.conf.json (expected v$version). Cut releases with \`npm run release -- <x.y.z>\`, which sets both."
            exit 1
          fi
          # Fails (with the reason) when CHANGELOG.md has no entries for this version.
          node scripts/changelog.mjs section "$version" > ../release-notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file ../release-notes.md >/dev/null
          else
            gh release create "$tag" --draft --verify-tag --title "Kimochi $tag" --notes-file ../release-notes.md
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Platform-independent and fast: formatting (oxfmt, rustfmt), oxlint and the TypeScript check.
  # Runs on every pull request, docs-only ones included.
  lint:
    name: Lint
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      # No `prepare` (it builds dist/, which none of these read).
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Formatting (run `npm run format` to fix)
        run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # The workflows themselves (this file included), with shellcheck on their scripts.
      - name: Lint workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  # The tests and the native lints and tests, per platform.
  checks:
    name: Checks (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.mode != 'skip' && needs.plan.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.checks) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      # Every check crate builds into one target directory, so the dependencies they share
      # (tauri, the capture and speech crates) compile once, and one cache holds them all.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # No debug info: nothing here is debugged, and it makes the builds, links and cache smaller.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          # Skip man-db's index rebuild, which apt otherwise runs after every install.
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -o Acquire::Retries=3
          # pipewire-bin: /usr/share/pipewire/client.conf (scripts/linux-appimage.mjs).
          # libavif-dev: dictionary AVIF images (Jitendex), which WebKitGTK cannot decode.
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libpipewire-0.3-dev pipewire-bin \
            libspa-0.2-dev libclang-dev libudev-dev libgstreamer1.0-dev gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-pulseaudio libavif-dev \
            libgtk-layer-shell0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Faster links: mold on Linux, LLVM's linker on Windows. Checks only; bundles link with each
      # platform's default linker.
      - uses: rui314/setup-mold@v1
        if: runner.os == 'Linux'
      - name: Link with rust-lld on Windows
        if: runner.os == 'Windows'
        run: |
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=rust-lld" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER=rust-lld" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: checks
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            src-tauri -> ../target
            capture-core -> ../target
            speech-core -> ../target
            screenai -> ../target
            vocr-core -> ../target

      # The engine trees (Yomitan, Hachidori, 10ten) the tests read are gitignored downloads of
      # the pinned releases (extensions/<id>.sha256.json); cached until a pin moves.
      - name: Restore engine downloads
        uses: actions/cache@v4
        with:
          path: extensions
          key: extensions-${{ hashFiles('extensions/*.json') }}
      - name: Fetch vendored extensions
        run: node scripts/sync-extension.mjs --all --if-missing

      # node_modules whole when package-lock.json is unchanged (`npm ci` takes minutes on the
      # Windows ARM64 image); then only `prepare` runs, building dist/.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.node-modules.outputs.cache-hit == 'true'
        run: npm run prepare
      - name: Save node_modules
        if: steps.node-modules.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      - run: npm test
      # cargo clippy -D warnings for src-tauri and the Screen AI worker. Creates the OCR resource
      # paths tauri.conf.json names (an empty runtime directory, the licences) so tauri-build's
      # resource copy succeeds without downloading anything.
      - run: npm run check:rust
      - name: Test capture-core
        # Swift-backed crates link @rpath/libswift_*.dylib from the OS. The variable is set on the
        # command line because SIP strips DYLD_* from /bin/bash's own environment.
        run: ${{ runner.os == 'macOS' && 'DYLD_LIBRARY_PATH=/usr/lib/swift ' || '' }}cargo test --manifest-path capture-core/Cargo.toml
      - name: Test speech-core
        # Sentence audio's listener, matcher and clips (the tests that need the ONNX Runtime and a
        # model are opt-in). Links capture-core, so the same Swift note applies.
        run: ${{ runner.os == 'macOS' && 'DYLD_LIBRARY_PATH=/usr/lib/swift ' || '' }}cargo test --manifest-path speech-core/Cargo.toml
      - name: Test the Screen AI worker crate
        # Its pipe protocol, result decoding and component search; Google's library is not needed.
        run: cargo test --manifest-path screenai/Cargo.toml
      # The Windows-only crates otherwise compile only inside a release bundle: the voice hook,
      # the text hook helper, the OneOCR worker and the `kimochi` command's launcher.
      - name: Check the Windows-only crates
        if: runner.os == 'Windows'
        run: |
          for crate in voicehook hookd oneocr-worker cli-launcher; do
            echo "::group::cargo check $crate"
            cargo check --manifest-path "$crate/Cargo.toml"
            echo "::endgroup::"
          done
      - name: Test vocr-core
        # VOCR6's pipeline (spotter decode, preprocessing, character cells, LM beam). The parity runs
        # against the Python reference need the models and are done by hand (vocr-core/README.md).
        run: cargo clippy --manifest-path vocr-core/Cargo.toml --all-targets -- -D warnings && cargo test --manifest-path vocr-core/Cargo.toml

  # The one status the `main` ruleset requires. Passes when every job this run needed passed
  # (a docs-only pull request skips the checks; main's run of a release commit skips them all).
  ci:
    name: CI
    needs: [plan, lint, checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sum up
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # Skipped is fine (the plan decided); failed or cancelled is not.
          ! echo "$RESULTS" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' >/dev/null

  bundle:
    name: Bundle (${{ matrix.name }})
    needs: [plan, lint, checks]
    permissions:
      contents: write
    # Only a tag (or a trial) bundles, and only once every platform's checks passed.
    if: ${{ !cancelled() && (needs.plan.outputs.mode == 'release' || needs.plan.outputs.mode == 'trial') && needs.lint.result == 'success' && needs.checks.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.bundles) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      KIMOCHI_TARGET: ${{ matrix.target }}
      # macOS: without the Apple secrets, ad-hoc sign the app and the bundled dylib.
      KIMOCHI_ADHOC: ${{ secrets.APPLE_CERTIFICATE == '' && '1' || '' }}
      # Step-level env is not visible to a step's own `if`, so expose the gates at job level.
      HAS_WINDOWS_SIGNING: ${{ secrets.AZURE_TENANT_ID != '' }}
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      # The AppImage tools tauri downloads would mount themselves with FUSE, which GitHub's
      # Ubuntu images lack; they unpack and run instead.
      - name: AppImage tools without FUSE
        if: runner.os == 'Linux'
        run: echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -o Acquire::Retries=3
          # pipewire-bin: /usr/share/pipewire/client.conf, which scripts/linux-appimage.mjs
          # copies into the AppImage with the modules it names.
          # libavif-dev: the app links libavif to decode dictionary AVIF images (Jitendex), which
          # WebKitGTK cannot; the AppImage bundles it with its AV1 decoder.
          # libgtk-layer-shell0: the AppImage bundles it so native Wayland overlays (Hyprland,
          # Sway, KDE) work without the user installing it.
          # xdg-utils: tauri's AppImage step runs xdg-mime, which the ARM64 image lacks.
          sudo apt-get install -y -o Acquire::Retries=3 \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libpipewire-0.3-dev pipewire-bin \
            libspa-0.2-dev libclang-dev libudev-dev libgstreamer1.0-dev gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-pulseaudio libavif-dev \
            libgtk-layer-shell0 xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@stable

      # Every Linux build links libavif for dictionary images (Jitendex) and bundles GTK
      # layer-shell for Wayland overlays: fail in seconds, naming the package, rather than at the
      # end of the bundle.
      - name: Check bundled Linux libraries
        if: runner.os == 'Linux'
        run: node scripts/linux-appimage.mjs --check-deps

      - name: Install OneOCR and text hook helper Rust targets
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc i686-pc-windows-msvc

      # Linux x64 ships the text hook helper too (Windows games under Proton/Wine), cross-built
      # with MinGW (scripts/prepare-hookd.mjs).
      - name: Install text hook helper Rust targets and MinGW
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          rustup target add x86_64-pc-windows-gnu i686-pc-windows-gnu
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -o Acquire::Retries=3 gcc-mingw-w64-x86-64 gcc-mingw-w64-i686

      - name: Ensure ARM64 C++ tools for OneOCR helper
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installed = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (-not $installed) {
            $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (-not $vs) { throw 'MSVC C++ tools not found' }
            $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
            $process = Start-Process $setup -ArgumentList @('modify', '--installPath', ('"' + $vs + '"'), '--add', 'Microsoft.VisualStudio.Component.VC.Tools.ARM64', '--quiet', '--norestart') -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) { throw "ARM64 C++ tools installation failed: $($process.ExitCode)" }
          }

      # scripts/sign-windows.mjs (tauri's signCommand) signs through Azure Artifact Signing with
      # this CLI. Its published Windows build (x64, emulated on ARM64), pinned by hash, instead of
      # compiling it for three minutes. To update: bump the version and the hash together.
      - name: Install Windows signing CLI
        if: runner.os == 'Windows' && env.HAS_WINDOWS_SIGNING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 0.12.0
          SHA256: dd6fa95a0367cbd32ea520037c3df72d1ed8f523a5b07883b0c2a4034e918a53
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/signing-cli"
          mkdir -p "$bin"
          gh release download "$VERSION" -R levminer/trusted-signing-cli -p artifact-signing-cli.exe -D "$bin"
          echo "$SHA256  $bin/artifact-signing-cli.exe" | sha256sum -c -
          echo "$bin" >> "$GITHUB_PATH"

      # macOS signing and notarisation are tauri's own: given APPLE_SIGNING_IDENTITY it signs the
      # .app with the hardened runtime, and given the App Store Connect API key (issuer, key id and
      # the .p8 file) it notarises the .app and staples the ticket, failing the build when Apple
      # rejects it. The Developer ID certificate (APPLE_CERTIFICATE, a base64 .p12) goes into a
      # keychain of this job's own, imported before scripts/run.mjs signs the bundled dylib.
      - name: Apple signing keychain and notarisation key
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          for name in APPLE_SIGNING_IDENTITY APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_CONTENT; do
            [[ -n "${!name}" ]] || { echo "APPLE_CERTIFICATE is set but $name is not" >&2; exit 1; }
          done
          umask 077
          keychain="$RUNNER_TEMP/kimochi-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          rm -f "$keychain"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user > "$RUNNER_TEMP/keychains-before"
          # shellcheck disable=SC2046 # one argument per keychain listed
          security list-keychains -d user -s "$keychain" $(sed 's/"//g' "$RUNNER_TEMP/keychains-before")
          security find-identity -v -p codesigning "$keychain"
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/apple-api-key.p8"
          # Not APPLE_CERTIFICATE: the identity is already in the job's keychain.
          {
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple-api-key.p8"
            for name in APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY; do
              printf '%s<<__APPLE__\n%s\n__APPLE__\n' "$name" "${!name}"
            done
          } >> "$GITHUB_ENV"

      # No engine tree is needed here: bundles carry none (the app downloads them on demand), and
      # scripts/prepare.mjs checks that dist/ holds none. main's node_modules for this OS.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.node-modules.outputs.cache-hit == 'true'
        run: npm run prepare
      - name: Bundle (${{ needs.plan.outputs.mode }})
        run: npm run ${{ needs.plan.outputs.script }}
        env:
          # Windows: scripts/sign-windows.mjs (signCommand) signs when these are present and
          # skips with a warning otherwise. KIMOCHI_REQUIRE_SIGNING makes a partial secret set
          # an error rather than a silently unsigned installer.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          KIMOCHI_SIGNING_ENDPOINT: ${{ vars.KIMOCHI_SIGNING_ENDPOINT }}
          KIMOCHI_SIGNING_ACCOUNT: ${{ vars.KIMOCHI_SIGNING_ACCOUNT }}
          KIMOCHI_SIGNING_PROFILE: ${{ vars.KIMOCHI_SIGNING_PROFILE }}
          KIMOCHI_REQUIRE_SIGNING: ${{ secrets.AZURE_TENANT_ID != '' && '1' || '' }}

      - name: Verify macOS signature and notarisation
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        run: |
          app=src-tauri/target/${{ needs.plan.outputs.profile }}/bundle/macos/Kimochi.app
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Remove the signing keychain and notarisation key
        if: always() && runner.os == 'macOS'
        run: |
          rm -f "$RUNNER_TEMP/apple-api-key.p8" "$RUNNER_TEMP/certificate.p12"
          if [[ -f "$RUNNER_TEMP/keychains-before" ]]; then
            # shellcheck disable=SC2046 # one argument per keychain listed
            security list-keychains -d user -s $(sed 's/"//g' "$RUNNER_TEMP/keychains-before")
            rm -f "$RUNNER_TEMP/keychains-before"
          fi
          security delete-keychain "$RUNNER_TEMP/kimochi-signing.keychain-db" 2>/dev/null || true

      - name: Verify Windows signature
        if: runner.os == 'Windows' && env.HAS_WINDOWS_SIGNING == 'true'
        shell: powershell
        run: |
          Get-ChildItem src-tauri/target/${{ needs.plan.outputs.profile }}/bundle/nsis/*-setup.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { exit 1 }
          }

      # What the app's self-updater downloads for this platform (macOS: a tar.gz of the .app;
      # Windows: the installer; Linux: the AppImage and the .deb), each one's minisign signature,
      # and a sidecar for the manifest job below. Runs after every step that touches the bundles
      # (the AppImage repack inside `npm run release:bundle`, Authenticode signing), so the
      # signature covers the bytes users download. The key is the TAURI_SIGNING_PRIVATE_KEY secret
      # (`tauri signer generate`); its public half is `plugins.updater.pubkey` in tauri.conf.json.
      - name: Updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/updater-artifacts.mjs sign --target "$KIMOCHI_TARGET" --profile ${{ needs.plan.outputs.profile }} --out ../updater

      # A zip keeps the .app's file modes and signature intact.
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent src-tauri/target/${{ needs.plan.outputs.profile }}/bundle/macos/Kimochi.app src-tauri/target/${{ needs.plan.outputs.profile }}/bundle/macos/Kimochi.app.zip

      # Releases keep tauri's versioned file names.
      - name: Upload to release
        if: needs.plan.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE: ${{ needs.plan.outputs.release }}
          PATTERNS: ${{ matrix.artifacts }}
        run: |
          set -euo pipefail
          rm -rf ../upload && mkdir ../upload
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          found=0
          while IFS= read -r pattern; do
            [[ -z "$pattern" ]] && continue
            for file in $pattern; do
              [[ -f "$file" ]] || continue
              found=1
              name="$(basename "$file")"
              case "$name" in
                Kimochi.app.zip) name="Kimochi_${version}_aarch64.app.zip" ;;
              esac
              cp "$file" "../upload/$name"
            done
          done <<< "$PATTERNS"
          [[ $found == 1 ]] || { echo "no bundle matched: $PATTERNS" >&2; exit 1; }
          # The updater's signatures, sidecars and the macOS tar.gz, named as the manifest will
          # name them.
          if [[ -d ../updater ]]; then cp ../updater/* ../upload/; fi
          ls -l ../upload
          gh release upload "$RELEASE" ../upload/* --clobber

      # A trial's bundles, to download from the run's page and try.
      - name: Collect trial updater artifacts
        if: needs.plan.outputs.mode == 'trial'
        run: cp -R ../updater trial-updater
      # A trial's bundles, to download from the run's page and try.
      - name: Upload trial bundles
        if: needs.plan.outputs.mode == 'trial'
        uses: actions/upload-artifact@v4
        with:
          name: Kimochi-${{ matrix.target }}
          path: |
            ${{ matrix.artifacts }}
            trial-updater/
          if-no-files-found: error
          retention-days: 7

  # A tag's release: `latest.json`, the document the app's updater fetches
  # (`https://github.com/<repo>/releases/latest/download/latest.json`), composed from the
  # sidecars every bundle job uploaded, and then the release published. It needs every bundle
  # job to succeed, so a release is published only when all platforms were checked, built and
  # signed: a manifest missing a platform would tell that platform there is no update, for good.
  # If anything fails, nothing is published and the release stays a draft: re-run the failed
  # jobs for a flaky runner, or delete the draft and the tag and cut a new version for a code fix.
  manifest:
    name: Update manifest and publish
    needs: [plan, bundle]
    if: needs.plan.outputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The script uses node built-ins only: no `npm ci`.
      - name: Compose and upload latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE: ${{ needs.plan.outputs.release }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          rm -rf ../manifest && mkdir ../manifest
          gh release download "$RELEASE" --pattern 'updater-*.json' --dir ../manifest
          gh release view "$RELEASE" --json body --jq .body > ../manifest/notes.md
          date="$(gh release view "$RELEASE" --json createdAt --jq .createdAt)"
          node scripts/updater-artifacts.mjs manifest \
            --version "$version" --tag "$RELEASE" --repo "$GH_REPO" \
            --sidecars ../manifest --notes ../manifest/notes.md --date "$date" \
            --out ../manifest/latest.json
          cat ../manifest/latest.json
          gh release upload "$RELEASE" ../manifest/latest.json --clobber
          # The sidecars have served their purpose.
          for sidecar in ../manifest/updater-*.json; do
            gh release delete-asset "$RELEASE" "$(basename "$sidecar")" --yes
          done
      # Last: from here installed apps are offered the update.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE: ${{ needs.plan.outputs.release }}
        run: |
          gh release edit "$RELEASE" --draft=false --latest
          echo "Published $GITHUB_SERVER_URL/$GH_REPO/releases/tag/$RELEASE" >> "$GITHUB_STEP_SUMMARY"

  # GITHUB_TOKEN publication does not trigger release-event workflows.
  announce:
    name: Announce release on Discord
    needs: [plan, manifest]
    if: needs.plan.outputs.mode == 'release'
    uses: ./.github/workflows/discord-release.yml
    with:
      tag: ${{ needs.plan.outputs.release }}
    secrets:
      DISCORD_RELEASES_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
