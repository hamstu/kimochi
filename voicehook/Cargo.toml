# Voice-hook library (built by Kimochi on Windows) and standalone test harness.
# See README.md.
[workspace]
members = ["common", "hook", "cli", "fixture", "classify"]
resolver = "2"

[workspace.dependencies]
serde_json = "1"
vh-common = { path = "common" }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Media",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 2
debug = "line-tables-only"
