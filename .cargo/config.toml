# ARM64 Linux and Windows: the gemm kernels candle pulls in (through kimochi-mangaocr) carry
# inline fp16 assembly that needs the FEAT_FP16 target feature, which rustc does not enable by
# default for these targets (macOS's arm64 baseline already has it). Every ARMv8.2+ CPU has it
# (Apple Silicon VMs, Snapdragon X, Raspberry Pi 5, Graviton, Ampere).
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+fp16"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+fp16"]
