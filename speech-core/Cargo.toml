[package]
name = "kimochi-speech"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Sentence audio: hearing which recorded speech is a game's line, and cutting it into clips."

[dependencies]
kimochi-capture = { path = "../capture-core" }
# The app's ONNX Runtime (bundled with MeikiOCR), loaded at run time: same pin as src-tauri.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
# MP3 for Anki through LAME, built from source (LGPL; NOTICE). No ffmpeg.
mp3lame-encoder = "0.2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
# As in src-tauri: `chunks_exact(2)` says "one 16-bit sample" more plainly than `as_chunks::<2>().0`.
chunks_exact_to_as_chunks = "allow"

# The lab's `video` mode drives Live Text, which answers on the main run loop.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
