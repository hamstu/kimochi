<!doctype html><meta charset="utf-8" />
<style>
  body {
    margin: 0;
    width: 800px;
    height: 1100px;
    background: #fff;
    font-family: 'Hiragino Mincho ProN', serif;
    position: relative;
    overflow: hidden;
  }
  .panel {
    position: absolute;
    border: 4px solid #111;
    background: linear-gradient(160deg, #f4f4f4, #d9d9d9);
  }
  .bubble {
    position: absolute;
    background: #fff;
    border: 3px solid #111;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .v {
    writing-mode: vertical-rl;
    font-size: 30px;
    line-height: 1.35;
    font-weight: 600;
    color: #111;
  }
  .sfx {
    position: absolute;
    font-size: 90px;
    font-weight: 900;
    color: #222;
    transform: rotate(-12deg);
    font-family: 'Hiragino Sans';
  }
</style>
<div class="panel" style="left: 20px; top: 20px; width: 760px; height: 520px">
  <div class="bubble" style="left: 470px; top: 30px; width: 230px; height: 330px">
    <div class="v">今日は本当に<br />いい天気だね！</div>
  </div>
  <div class="bubble" style="left: 90px; top: 120px; width: 220px; height: 300px">
    <div class="v">散歩に<br />行こうか？</div>
  </div>
  <div class="sfx" style="left: 330px; top: 380px">ドキドキ</div>
</div>
<div class="panel" style="left: 20px; top: 560px; width: 370px; height: 520px">
  <div class="bubble" style="left: 60px; top: 60px; width: 240px; height: 380px">
    <div class="v">ちょっと待って、<br />財布を<br />忘れちゃった。</div>
  </div>
</div>
<div class="panel" style="left: 410px; top: 560px; width: 370px; height: 520px">
  <div class="bubble" style="left: 70px; top: 50px; width: 230px; height: 360px">
    <div class="v">しょうがないなあ、<br />僕がおごるよ。</div>
  </div>
</div>
