<!doctype html><meta charset="utf-8" />
<style>
  body {
    margin: 0;
    width: 800px;
    height: 1100px;
    background: #fff;
    font-family: 'Hiragino Mincho ProN', serif;
    position: relative;
    overflow: hidden;
  }
  .panel {
    position: absolute;
    border: 4px solid #111;
    background: linear-gradient(200deg, #eee, #cfcfcf);
  }
  .bubble {
    position: absolute;
    background: #fff;
    border: 3px solid #111;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .v {
    writing-mode: vertical-rl;
    font-size: 30px;
    line-height: 1.35;
    font-weight: 600;
    color: #111;
  }
</style>
<div class="panel" style="left: 20px; top: 20px; width: 760px; height: 1060px">
  <div class="bubble" style="left: 440px; top: 60px; width: 260px; height: 380px">
    <div class="v">駅前の喫茶店で<br />待ち合わせしよう。</div>
  </div>
  <div class="bubble" style="left: 90px; top: 520px; width: 260px; height: 420px">
    <div class="v">分かった、<br />三時に<br />行くね！</div>
  </div>
</div>
