<!doctype html><meta charset="utf-8" />
<style>
  body {
    margin: 0;
    width: 1280px;
    height: 720px;
    background: linear-gradient(#5a7fb5, #c9a37a);
    font-family: 'Hiragino Sans';
    position: relative;
    overflow: hidden;
  }
  .box {
    position: absolute;
    left: 80px;
    right: 80px;
    bottom: 40px;
    height: 200px;
    background: rgba(10, 14, 30, 0.82);
    border: 3px solid #e8d9b0;
    border-radius: 14px;
    color: #fff;
    padding: 28px 40px;
    box-sizing: border-box;
    font-size: 34px;
    line-height: 1.6;
  }
  .name {
    position: absolute;
    left: 110px;
    bottom: 220px;
    background: #e8d9b0;
    color: #222;
    font-size: 28px;
    padding: 6px 24px;
    border-radius: 8px;
    font-weight: 700;
  }
</style>
<div class="name">さくら</div>
<div class="box">ねえ、この町の図書館に行ったことある？<br />古い本がたくさんあって、とても静かなんだよ。</div>
