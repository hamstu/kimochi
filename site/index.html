<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- head:start · The dev server shows these; the build replaces them per route with the tags
         from src/lib/seo.js (title, description, canonical, Open Graph, JSON-LD). -->
    <title>Kimochi · Read Japanese games with an OCR overlay</title>
    <meta
      name="description"
      content="Kimochi is a free, open-source desktop app for macOS, Windows and Linux that reads the Japanese text in your games, manga, videos and apps, draws it right over them, and lets you hover any word to look it up and make Anki cards."
    />
    <!-- head:end -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Apply the saved theme before first paint so the page never flashes. Keep the storage key
         in sync with src/lib/theme.ts. -->
    <script>
      try {
        var t = localStorage.getItem('kimochi-site-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
